<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Իմ վաճառքները</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.logo{
  display:block;
  width:200px;
  max-width:65%;
  margin:5px auto 18px;
}

.header{
  text-align:center;
  margin-bottom:22px;
}

h1{
  margin:0 0 7px;
  font-size:27px;
}

.subtitle{
  color:#8f9db8;
  font-size:14px;
}

.nameBox{
  background:#111c30;
  border-radius:18px;
  padding:15px;
  margin-bottom:15px;
}

.nameLabel{
  color:#8f9db8;
  font-size:12px;
  margin-bottom:7px;
}

.nameInput{
  width:100%;
  border:1px solid #31425e;
  background:#0c1526;
  color:#fff;
  padding:14px;
  border-radius:12px;
  font-size:17px;
  font-weight:800;
  outline:none;
}

.resultTop{
  background:linear-gradient(135deg,#142b4a,#0c739e);
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
}

.resultLabel{
  font-size:13px;
  opacity:.8;
}

.moneyBig{
  font-size:34px;
  font-weight:900;
  margin-top:5px;
  color:#67f2bf;
}

.salesCount{
  margin-top:12px;
  font-size:14px;
  color:#d0dbed;
}

.packageCard{
  background:#111c30;
  border-radius:17px;
  padding:14px;
  margin-bottom:10px;
}

.packageTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.packageName{
  font-size:18px;
  font-weight:900;
}

.bonusText{
  color:#7f91ad;
  font-size:12px;
  margin-top:4px;
}

.countInput{
  width:80px;
  border:1px solid #34435d;
  background:#172238;
  color:#fff;
  padding:11px 5px;
  border-radius:11px;
  text-align:center;
  font-size:18px;
  font-weight:900;
  outline:none;
}

.packageResult{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #23334c;
  font-size:13px;
  color:#8f9db8;
}

.packageMoney{
  color:#62e9b8;
  font-size:16px;
  font-weight:900;
}

.bottomBox{
  background:#111c30;
  border-radius:18px;
  padding:16px;
  margin-top:18px;
}

.bottomRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0;
}

.bottomTitle{
  color:#8f9db8;
}

.bottomValue{
  font-size:18px;
  font-weight:900;
}

.saveNote{
  text-align:center;
  font-size:12px;
  color:#697894;
  margin-top:18px;
  line-height:1.5;
}
</style>

</head>

<body>

<div class="container">

<img src="IMG_7968.png" class="logo">

<div class="header">
  <h1>Իմ վաճառքները</h1>
  <div class="subtitle">
    Գրիր վաճառքներդ և տես քո բոնուսը
  </div>
</div>

<div class="nameBox">

  <div class="nameLabel">
    Աշխատակցի անուն
  </div>

  <input
    id="employeeName"
    class="nameInput"
    type="text"
    placeholder="Գրիր անունդ"
    oninput="saveData()"
  >

</div>

<div class="resultTop">

  <div class="resultLabel">
    Քո ընդհանուր բոնուսը
  </div>

  <div class="moneyBig" id="totalBonus">
    0 դրամ
  </div>

  <div class="salesCount" id="totalSales">
    Ընդհանուր վաճառք՝ 0
  </div>

</div>

<div id="packages"></div>

<div class="bottomBox">

  <div class="bottomRow">
    <div class="bottomTitle">
      Ընդհանուր վաճառք
    </div>

    <div class="bottomValue" id="bottomSales">
      0
    </div>
  </div>

  <div class="bottomRow">
    <div class="bottomTitle">
      Ընդհանուր բոնուս
    </div>

    <div class="bottomValue" id="bottomBonus">
      0 դրամ
    </div>
  </div>

</div>

<div class="saveNote">
  Տվյալները ավտոմատ պահպանվում են այս հեռախոսի browser-ում։
</div>

</div>

<script>

const packages = [
  {price:3900, bonus:1000},
  {price:4900, bonus:1200},
  {price:5900, bonus:2000},
  {price:6900, bonus:1500},
  {price:7900, bonus:3000},
  {price:8900, bonus:2500}
];

let sales = loadSales();

function money(number){

  return new Intl.NumberFormat("hy-AM")
    .format(number) + " դրամ";
}

function loadSales(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("workerSales")
      );

    if(
      Array.isArray(saved) &&
      saved.length === 6
    ){
      return saved;
    }

  }catch(e){}

  return [0,0,0,0,0,0];
}

function loadName(){

  return localStorage.getItem("workerName") || "";
}

function renderPackages(){

  const container =
    document.getElementById("packages");

  container.innerHTML = "";

  packages.forEach((item,index)=>{

    const card =
      document.createElement("div");

    card.className = "packageCard";

    card.innerHTML = `

      <div class="packageTop">

        <div>

          <div class="packageName">
            ${money(item.price)}
          </div>

          <div class="bonusText">
            1 վաճառքից՝ ${money(item.bonus)}
          </div>

        </div>

        <input
          class="countInput"
          type="number"
          min="0"
          value="${sales[index]}"
          oninput="changeSale(${index},this.value)"
        >

      </div>

      <div class="packageResult">

        <span>
          Այս փաթեթից ստացել ես
        </span>

        <span
          class="packageMoney"
          id="packageMoney${index}"
        >
          0 դրամ
        </span>

      </div>

    `;

    container.appendChild(card);

  });

  calculate();
}

function changeSale(index,value){

  let number =
    parseInt(value);

  if(
    isNaN(number) ||
    number < 0
  ){
    number = 0;
  }

  sales[index] = number;

  saveData();
  calculate();
}

function calculate(){

  let totalSales = 0;
  let totalBonus = 0;

  packages.forEach((item,index)=>{

    const count =
      Number(sales[index]) || 0;

    const bonus =
      count * item.bonus;

    totalSales += count;
    totalBonus += bonus;

    document.getElementById(
      "packageMoney" + index
    ).textContent =
      money(bonus);

  });

  document.getElementById(
    "totalBonus"
  ).textContent =
    money(totalBonus);

  document.getElementById(
    "totalSales"
  ).textContent =
    "Ընդհանուր վաճառք՝ " +
    totalSales;

  document.getElementById(
    "bottomSales"
  ).textContent =
    totalSales;

  document.getElementById(
    "bottomBonus"
  ).textContent =
    money(totalBonus);
}

function saveData(){

  localStorage.setItem(
    "workerSales",
    JSON.stringify(sales)
  );

  localStorage.setItem(
    "workerName",
    document.getElementById(
      "employeeName"
    ).value
  );
}

document.getElementById(
  "employeeName"
).value =
  loadName();

renderPackages();

</script>

</body>
</html>

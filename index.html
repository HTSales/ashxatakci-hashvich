<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>HT Sales</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#08101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HT Sales">
<link rel="apple-touch-icon" href="./IMG_7968.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:650px;
  margin:auto;
  padding:18px;
  padding-top:max(18px,env(safe-area-inset-top));
  padding-bottom:max(30px,env(safe-area-inset-bottom));
}

.logo{
  display:block;
  width:220px;
  max-width:70%;
  margin:5px auto 12px;
}

.header{
  text-align:center;
}

h1{
  margin:0;
  font-size:28px;
}

.subtitle{
  margin-top:5px;
  color:#8997b3;
}

.dateBox{
  background:#111c30;
  border-radius:18px;
  padding:14px;
  margin-top:16px;
  text-align:center;
}

.date{
  font-size:18px;
  font-weight:900;
  color:#69e6b9;
}

.clock{
  margin-top:5px;
  font-size:13px;
  color:#8997b3;
}

.searchBox{
  margin-top:15px;
  background:#111c30;
  padding:14px;
  border-radius:18px;
}

.searchInput{
  width:100%;
  background:#0b1526;
  color:#fff;
  border:1px solid #2b3954;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  outline:none;
}

.searchBtn{
  width:100%;
  margin-top:9px;
  padding:13px;
  border:none;
  border-radius:12px;
  background:#28a8df;
  color:#fff;
  font-weight:900;
  font-size:15px;
}

.employeeCard{
  display:none;
  margin-top:15px;
}

.nameCard{
  background:#111c30;
  border-radius:18px;
  padding:16px;
}

.employeeName{
  font-size:23px;
  font-weight:900;
}

.employeeDate{
  margin-top:4px;
  color:#8997b3;
  font-size:13px;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.summaryCard{
  background:#111c30;
  border-radius:17px;
  padding:15px;
  text-align:center;
}

.summaryLabel{
  color:#8997b3;
  font-size:11px;
}

.summaryValue{
  margin-top:5px;
  font-size:22px;
  font-weight:900;
}

.bonusCard{
  margin-top:10px;
  background:linear-gradient(135deg,#143552,#0e6b78);
  border-radius:18px;
  padding:16px;
  text-align:center;
}

.bonusLabel{
  font-size:12px;
  opacity:.8;
}

.bonusValue{
  font-size:30px;
  font-weight:900;
  margin-top:5px;
}

.motivation{
  margin-top:8px;
  font-size:14px;
  font-weight:700;
}

.sectionTitle{
  font-size:20px;
  font-weight:900;
  margin:20px 0 10px;
}

.packages{
  display:grid;
  gap:9px;
}

.packageCard{
  background:#111c30;
  border-radius:16px;
  padding:14px;
}

.packageTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.packageName{
  font-size:17px;
  font-weight:900;
}

.packagePrice{
  color:#8997b3;
  font-size:12px;
  margin-top:3px;
}

.packageCount{
  background:#0b1526;
  border-radius:12px;
  padding:8px 12px;
  text-align:center;
  min-width:65px;
}

.countNumber{
  font-size:22px;
  font-weight:900;
}

.countText{
  color:#8997b3;
  font-size:10px;
}

.packageBottom{
  margin-top:11px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
}

.packageBottom span{
  color:#8997b3;
}

.earned{
  color:#69e6b9 !important;
  font-weight:900;
}

.downloadBtn{
  width:100%;
  margin-top:16px;
  border:none;
  border-radius:13px;
  padding:14px;
  background:#16794d;
  color:white;
  font-size:14px;
  font-weight:900;
}

.updated{
  text-align:center;
  color:#8997b3;
  margin-top:10px;
  font-size:11px;
}

.status{
  text-align:center;
  margin-top:12px;
  color:#8997b3;
  font-size:13px;
  min-height:18px;
}

@media(max-width:420px){
  .summary{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<img src="./IMG_7968.png" class="logo" alt="Home Telecom">

<div class="header">
  <h1>Իմ Վաճառքները</h1>
  <div class="subtitle">Home Telecom</div>
</div>

<div class="dateBox">
  <div class="date" id="dateText"></div>
  <div class="clock" id="clockText"></div>
</div>

<div class="searchBox">
  <input
    id="employeeInput"
    class="searchInput"
    placeholder="Գրիր անունդ"
    autocomplete="off"
  >

  <button
    class="searchBtn"
    onclick="searchEmployee()"
  >
    Բացել իմ արդյունքները
  </button>
</div>

<div class="status" id="status"></div>

<div class="employeeCard" id="employeeCard">

  <div class="nameCard">
    <div class="employeeName" id="employeeName"></div>
    <div class="employeeDate" id="employeeDate"></div>
  </div>

  <div class="summary">

    <div class="summaryCard">
      <div class="summaryLabel">Ընդհանուր վաճառք</div>
      <div class="summaryValue" id="totalSales">0</div>
    </div>

    <div class="summaryCard">
      <div class="summaryLabel">Փաթեթների տեսակներ</div>
      <div class="summaryValue">9</div>
    </div>

  </div>

  <div class="bonusCard">
    <div class="bonusLabel">Այսօրվա բոնուսը</div>
    <div class="bonusValue" id="totalBonus">0 դրամ</div>

    <div class="motivation" id="motivationText">
      Սա քիչ է, ավելին կարող ես դու... 🚀
    </div>
  </div>

  <div class="sectionTitle">
    Այսօրվա վաճառքները
  </div>

  <div class="packages" id="packages"></div>

  <button
    class="downloadBtn"
    onclick="downloadExcel()"
  >
    📥 Ներբեռնել այսօրվա արդյունքը
  </button>

  <div class="updated" id="updatedText"></div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const fieldByCode = {
  home_standard:"package_6900",
  home_premium:"package_7900",
  home_ultima:"package_8900",

  inet1:"package_3900",
  inet2:"package_4900",
  inet3:"package_5900",

  iptv1:"package_iptv1",
  iptv2:"package_iptv2",
  iptv3:"package_iptv3"
};

const packageOrder = [
  "home_standard",
  "home_premium",
  "home_ultima",
  "inet1",
  "inet2",
  "inet3",
  "iptv1",
  "iptv2",
  "iptv3"
];

let currentEmployee = null;
let currentSalesRow = null;
let packages = [];
let currentDay = "";

function money(number){
  return new Intl.NumberFormat("hy-AM")
    .format(Number(number) || 0) + " դրամ";
}

function localDateKey(){
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function prettyDate(dateString){
  const months = [
    "Հունվար",
    "Փետրվար",
    "Մարտ",
    "Ապրիլ",
    "Մայիս",
    "Հունիս",
    "Հուլիս",
    "Օգոստոս",
    "Սեպտեմբեր",
    "Հոկտեմբեր",
    "Նոյեմբեր",
    "Դեկտեմբեր"
  ];

  const p = dateString.split("-");

  return (
    Number(p[2]) +
    " " +
    months[Number(p[1])-1] +
    " " +
    p[0]
  );
}

function updateClock(){
  const d = new Date();

  document.getElementById("clockText").textContent =
    d.toLocaleTimeString(
      "hy-AM",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  document.getElementById("dateText").textContent =
    d.toLocaleDateString(
      "hy-AM",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );
}

function getMotivation(totalBonus){
  if(totalBonus >= 40000){
    return "Դու գերազանցեցիր քեզ 🏆";
  }

  if(totalBonus >= 20000){
    return "Այ էսպես շարունակիր 🔥";
  }

  return "Սա քիչ է, ավելին կարող ես դու... 🚀";
}

function sortPackages(list){
  return [...list].sort(
    (a,b)=>
      packageOrder.indexOf(a.code)
      -
      packageOrder.indexOf(b.code)
  );
}

function setStatus(text){
  document.getElementById("status").textContent = text;
}

async function searchEmployee(){

  const input =
    document.getElementById("employeeInput");

  const name =
    input.value.trim();

  if(!name){
    setStatus("Գրիր անունդ");
    return;
  }

  localStorage.setItem(
    "ht_employee_name",
    name
  );

  setStatus("Բեռնվում է...");

  currentDay =
    localDateKey();

  try{

    const employeeRes =
      await db
        .from("employees")
        .select("*")
        .ilike("name",name)
        .eq("active",true)
        .maybeSingle();

    if(employeeRes.error)
      throw employeeRes.error;

    if(!employeeRes.data){

      currentEmployee = null;

      document.getElementById(
        "employeeCard"
      ).style.display = "none";

      setStatus(
        "Այդ անունով աշխատակից չգտնվեց"
      );

      return;
    }

    currentEmployee =
      employeeRes.data;

    const [
      packagesRes,
      salesRes
    ] =
    await Promise.all([

      db
        .from("packages")
        .select("*"),

      db
        .from("daily_sales")
        .select("*")
        .eq(
          "employee_id",
          currentEmployee.id
        )
        .eq(
          "sale_date",
          currentDay
        )
        .maybeSingle()

    ]);

    if(packagesRes.error)
      throw packagesRes.error;

    if(salesRes.error)
      throw salesRes.error;

    packages =
      sortPackages(
        packagesRes.data || []
      );

    currentSalesRow =
      salesRes.data || null;

    renderEmployee();

    setStatus("");

  }
  catch(error){

    console.error(error);

    setStatus(
      "Տվյալները բեռնել չհաջողվեց"
    );
  }
}

function renderEmployee(){

  if(!currentEmployee)
    return;

  let totalSales = 0;
  let totalBonus = 0;

  let html = "";

  packages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field)
      return;

    const count =
      currentSalesRow
        ? Number(
            currentSalesRow[field]
          ) || 0
        : 0;

    const bonus =
      Number(pkg.bonus) || 0;

    const earned =
      count * bonus;

    totalSales += count;
    totalBonus += earned;

    html += `

      <div class="packageCard">

        <div class="packageTop">

          <div>
            <div class="packageName">
              ${escapeHtml(pkg.name || pkg.code)}
            </div>

            <div class="packagePrice">
              ${money(pkg.price)}
            </div>
          </div>

          <div class="packageCount">

            <div class="countNumber">
              ${count}
            </div>

            <div class="countText">
              վաճառք
            </div>

          </div>

        </div>

        <div class="packageBottom">

          <span>
            1 վաճառքից՝
            ${money(bonus)}
          </span>

          <span class="earned">
            + ${money(earned)}
          </span>

        </div>

      </div>

    `;
  });

  document.getElementById(
    "employeeCard"
  ).style.display = "block";

  document.getElementById(
    "employeeName"
  ).textContent =
    currentEmployee.name;

  document.getElementById(
    "employeeDate"
  ).textContent =
    prettyDate(currentDay);

  document.getElementById(
    "totalSales"
  ).textContent =
    totalSales;

  document.getElementById(
    "totalBonus"
  ).textContent =
    money(totalBonus);

  document.getElementById(
    "motivationText"
  ).textContent =
    getMotivation(totalBonus);

  document.getElementById(
    "packages"
  ).innerHTML =
    html;

  document.getElementById(
    "updatedText"
  ).textContent =
    "Թարմացվել է՝ " +
    new Date().toLocaleTimeString(
      "hy-AM",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );
}

async function refreshEmployee(){

  if(!currentEmployee)
    return;

  const newDay =
    localDateKey();

  if(newDay !== currentDay){
    currentDay = newDay;
  }

  try{

    const [
      packagesRes,
      salesRes
    ] =
    await Promise.all([

      db
        .from("packages")
        .select("*"),

      db
        .from("daily_sales")
        .select("*")
        .eq(
          "employee_id",
          currentEmployee.id
        )
        .eq(
          "sale_date",
          currentDay
        )
        .maybeSingle()

    ]);

    if(packagesRes.error)
      throw packagesRes.error;

    if(salesRes.error)
      throw salesRes.error;

    packages =
      sortPackages(
        packagesRes.data || []
      );

    currentSalesRow =
      salesRes.data || null;

    renderEmployee();

  }
  catch(error){
    console.error(error);
  }
}

function downloadExcel(){

  if(!currentEmployee)
    return;

  if(typeof XLSX === "undefined"){
    alert("Excel համակարգը չի բեռնվել");
    return;
  }

  let totalSales = 0;
  let totalBonus = 0;

  const rows = [
    ["ՔՈ ԱՅՍՕՐՎԱ ԱՐԴՅՈՒՆՔԸ"],
    [],
    ["Աշխատակից",currentEmployee.name],
    ["Ամսաթիվ",prettyDate(currentDay)],
    [],
    [
      "Փաթեթ",
      "Գին",
      "Վաճառքների քանակ",
      "1 վաճառքի բոնուս",
      "Վաստակած բոնուս"
    ]
  ];

  packages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field)
      return;

    const count =
      currentSalesRow
        ? Number(
            currentSalesRow[field]
          ) || 0
        : 0;

    const bonus =
      Number(pkg.bonus) || 0;

    const earned =
      count * bonus;

    totalSales += count;
    totalBonus += earned;

    rows.push([
      pkg.name,
      Number(pkg.price),
      count,
      bonus,
      earned
    ]);
  });

  rows.push([]);
  rows.push([
    "Ընդհանուր վաճառք",
    totalSales
  ]);

  rows.push([
    "Ընդհանուր բոնուս",
    totalBonus
  ]);

  rows.push([]);
  rows.push([
    "Մոտիվացիա",
    getMotivation(totalBonus)
  ]);

  const ws =
    XLSX.utils.aoa_to_sheet(rows);

  ws["!cols"] = [
    {wch:24},
    {wch:14},
    {wch:19},
    {wch:20},
    {wch:21}
  ];

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Իմ արդյունքը"
  );

  const excelData =
    XLSX.write(
      wb,
      {
        bookType:"xlsx",
        type:"array"
      }
    );

  const blob =
    new Blob(
      [excelData],
      {
        type:
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "Քո Այսօրվա Արդյունքը.xlsx";

  link.style.display =
    "none";

  document.body.appendChild(link);

  link.click();

  setTimeout(()=>{

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

  },3000);
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

updateClock();

setInterval(
  updateClock,
  1000
);

setInterval(
  refreshEmployee,
  5000
);

window.addEventListener(
  "load",
  ()=>{

    const savedName =
      localStorage.getItem(
        "ht_employee_name"
      );

    if(savedName){

      document.getElementById(
        "employeeInput"
      ).value =
        savedName;

      searchEmployee();
    }
  }
);

</script>

</body>
</html>

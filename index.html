<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Իմ Վաճառքները</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

/* LOGO */

.logo{
  display:block;
  width:230px;
  max-width:75%;
  height:auto;
  margin:10px auto 20px;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:0 0 7px;
  font-size:28px;
}

.subtitle{
  color:#8e9ab3;
  font-size:14px;
}

/* SEARCH */

.searchBox{
  background:#111c30;
  border-radius:20px;
  padding:16px;
  margin-bottom:15px;
}

.nameInput{
  width:100%;
  border:1px solid #2a3a55;
  border-radius:13px;
  background:#0c1526;
  color:#fff;
  padding:15px;
  font-size:17px;
  outline:none;
  margin-bottom:10px;
}

.searchButton{
  width:100%;
  border:0;
  border-radius:13px;
  background:#25a8df;
  color:#fff;
  padding:15px;
  font-size:16px;
  font-weight:900;
}

.status{
  text-align:center;
  min-height:20px;
  margin:10px 0;
  font-size:13px;
  color:#8e9ab3;
}

/* WELCOME */

.welcome{
  background:linear-gradient(135deg,#162842,#101b2e);
  border-radius:20px;
  padding:17px;
  margin-bottom:14px;
}

.employeeName{
  font-size:25px;
  font-weight:900;
}

.motivation{
  margin-top:7px;
  color:#62e9b8;
  font-size:16px;
  font-weight:800;
}

/* TOTAL */

.summary{
  background:linear-gradient(135deg,#142b4a,#0c739e);
  border-radius:20px;
  padding:17px;
  margin-bottom:15px;
}

.summaryTitle{
  font-size:12px;
  opacity:.75;
}

.summaryValue{
  font-size:30px;
  font-weight:900;
  margin-top:5px;
}

.summaryGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.summaryItem{
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:12px;
}

.small{
  font-size:11px;
  opacity:.7;
}

.value{
  font-size:17px;
  font-weight:900;
  margin-top:4px;
}

/* PACKAGES */

.package{
  background:#111c30;
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
}

.packageTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.packagePrice{
  font-size:19px;
  font-weight:900;
}

.countBox{
  background:#172238;
  border-radius:11px;
  min-width:65px;
  text-align:center;
  padding:10px;
}

.countNumber{
  font-size:21px;
  font-weight:900;
}

.countLabel{
  font-size:9px;
  color:#8e9ab3;
  margin-top:2px;
}

.packageInfo{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.infoBox{
  background:#0c1526;
  border-radius:11px;
  padding:10px;
}

.infoLabel{
  color:#8391ab;
  font-size:11px;
}

.infoValue{
  font-size:15px;
  font-weight:800;
  margin-top:4px;
}

.earned{
  color:#62e9b8;
}

.hidden{
  display:none;
}

.notFound{
  background:#311c27;
  color:#ff9baa;
  border-radius:14px;
  padding:14px;
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

  <!-- ԼՈԳՈՆ -->
  <img
    src="./IMG_7968.png"
    class="logo"
    alt="Home Telecom"
  >

  <div class="header">
    <h1>Իմ Վաճառքները</h1>

    <div class="subtitle">
      Գրեք ձեր անունը և տեսեք ձեր արդյունքը
    </div>
  </div>

  <div class="searchBox">

    <input
      id="nameInput"
      class="nameInput"
      type="text"
      placeholder="Գրեք ձեր անունը"
      autocomplete="off"
    >

    <button
      class="searchButton"
      onclick="findEmployee()"
    >
      Տեսնել իմ արդյունքը
    </button>

  </div>

  <div id="status" class="status"></div>

  <div id="result" class="hidden">

    <!-- ԱՆՈՒՆ + ՄՈՏԻՎԱՑԻԱ -->

    <div class="welcome">

      <div
        class="employeeName"
        id="employeeName">
      </div>

      <div class="motivation">
        Դու կարող ես ավելին... 🚀
      </div>

    </div>

    <!-- ԸՆԴՀԱՆՈՒՐ ԱՐԴՅՈՒՆՔ -->

    <div class="summary">

      <div class="summaryTitle">
        Ընդհանուր ստացած բոնուս
      </div>

      <div
        class="summaryValue"
        id="totalBonus"
      >
        0 դրամ
      </div>

      <div class="summaryGrid">

        <div class="summaryItem">
          <div class="small">
            Ընդհանուր վաճառք
          </div>

          <div
            class="value"
            id="totalSales"
          >
            0
          </div>
        </div>

        <div class="summaryItem">
          <div class="small">
            Վերջին թարմացում
          </div>

          <div
            class="value"
            id="updatedTime"
          >
            —
          </div>
        </div>

      </div>

    </div>

    <!-- ՓԱԹԵԹՆԵՐ -->

    <div id="packages"></div>

  </div>

  <div
    id="notFound"
    class="notFound hidden"
  >
    Այս անունով աշխատակից չի գտնվել
  </div>

</div>

<script>

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentName = "";
let refreshTimer = null;

function money(number){
  return new Intl.NumberFormat("hy-AM")
    .format(Number(number) || 0) + " դրամ";
}

function setStatus(text){
  document.getElementById("status").textContent = text;
}

/* ԱՇԽԱՏԱԿՑԻ ՈՐՈՆՈՒՄ */

async function findEmployee(){

  const input = document
    .getElementById("nameInput")
    .value
    .trim();

  if(!input){
    setStatus("Գրեք ձեր անունը");
    return;
  }

  currentName = input;

  localStorage.setItem(
    "employeeName",
    input
  );

  await loadEmployee(
    input,
    true
  );

  if(refreshTimer){
    clearInterval(refreshTimer);
  }

  refreshTimer = setInterval(
    function(){

      if(currentName){
        loadEmployee(
          currentName,
          false
        );
      }

    },
    5000
  );
}

/* SUPABASE-ԻՑ ՏՎՅԱԼՆԵՐ */

async function loadEmployee(
  name,
  showLoading
){

  if(showLoading){
    setStatus("Բեռնում է...");
  }

  try{

    const employeeResponse =
      await db
        .from("employees")
        .select("*")
        .ilike("name", name)
        .maybeSingle();

    if(employeeResponse.error){
      throw employeeResponse.error;
    }

    const packagesResponse =
      await db
        .from("packages")
        .select("price,bonus")
        .order("price");

    if(packagesResponse.error){
      throw packagesResponse.error;
    }

    const employee =
      employeeResponse.data;

    const packageList =
      packagesResponse.data || [];

    if(!employee){

      document
        .getElementById("result")
        .classList
        .add("hidden");

      document
        .getElementById("notFound")
        .classList
        .remove("hidden");

      setStatus("");

      return;
    }

    document
      .getElementById("notFound")
      .classList
      .add("hidden");

    renderEmployee(
      employee,
      packageList
    );

    setStatus(
      "● Տվյալները թարմացված են"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Չհաջողվեց բեռնել տվյալները"
    );
  }
}

/* ՑՈՒՅՑ ՏԱԼ ԱՐԴՅՈՒՆՔԸ */

function renderEmployee(
  employee,
  packageList
){

  document
    .getElementById("result")
    .classList
    .remove("hidden");

  document
    .getElementById("employeeName")
    .textContent =
      employee.name;

  let totalSales = 0;
  let totalBonus = 0;

  let html = "";

  packageList.forEach(function(p){

    const field =
      "package_" + p.price;

    const count =
      Number(employee[field]) || 0;

    const bonus =
      Number(p.bonus) || 0;

    const earned =
      count * bonus;

    totalSales += count;
    totalBonus += earned;

    html += `

      <div class="package">

        <div class="packageTop">

          <div class="packagePrice">
            ${money(p.price)}
          </div>

          <div class="countBox">

            <div class="countNumber">
              ${count}
            </div>

            <div class="countLabel">
              ՎԱՃԱՌՔ
            </div>

          </div>

        </div>

        <div class="packageInfo">

          <div class="infoBox">

            <div class="infoLabel">
              1 վաճառքից բոնուս
            </div>

            <div class="infoValue">
              ${money(bonus)}
            </div>

          </div>

          <div class="infoBox">

            <div class="infoLabel">
              Ստացած բոնուս
            </div>

            <div class="infoValue earned">
              ${money(earned)}
            </div>

          </div>

        </div>

      </div>

    `;
  });

  document
    .getElementById("packages")
    .innerHTML = html;

  document
    .getElementById("totalSales")
    .textContent =
      totalSales;

  document
    .getElementById("totalBonus")
    .textContent =
      money(totalBonus);

  document
    .getElementById("updatedTime")
    .textContent =
      new Date().toLocaleTimeString(
        "hy-AM",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );
}

/* ENTER-ՈՎ ՄՈՒՏՔ */

document
  .getElementById("nameInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        findEmployee();
      }

    }
  );

/* ՀԻՇԵԼ ԱՇԽԱՏԱԿՑԻ ԱՆՈՒՆԸ */

window.addEventListener(
  "load",
  async function(){

    const saved =
      localStorage.getItem(
        "employeeName"
      );

    if(saved){

      document
        .getElementById("nameInput")
        .value = saved;

      currentName = saved;

      await loadEmployee(
        saved,
        true
      );

      refreshTimer =
        setInterval(
          function(){

            if(currentName){
              loadEmployee(
                currentName,
                false
              );
            }

          },
          5000
        );
    }

  }
);

</script>

</body>
</html>

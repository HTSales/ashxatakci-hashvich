<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Home Telecom Sales</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#08101d">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HT Sales">

<link rel="apple-touch-icon" href="./IMG_7968.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:#08101d;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.logo{
  display:block;
  width:220px;
  max-width:70%;
  margin:5px auto 12px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:29px;
}

.subtitle{
  color:#8d9ab5;
  margin-top:5px;
}

.dateBox{
  background:#111c30;
  border-radius:18px;
  padding:14px;
  text-align:center;
  margin-bottom:15px;
}

.date{
  font-size:18px;
  font-weight:900;
  color:#6ce7bb;
}

.clock{
  margin-top:5px;
  color:#8d9ab5;
  font-size:13px;
}

.searchCard{
  background:#111c30;
  border-radius:18px;
  padding:15px;
  margin-bottom:15px;
}

.searchTitle{
  font-size:12px;
  color:#8d9ab5;
  margin-bottom:8px;
}

.searchRow{
  display:flex;
  gap:8px;
}

.searchInput{
  flex:1;
  min-width:0;
  background:#0b1526;
  color:#fff;
  border:1px solid #2c3b56;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  outline:none;
}

.searchBtn{
  border:none;
  border-radius:12px;
  padding:0 17px;
  background:#249fd4;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.employeeCard{
  display:none;
}

.employeeHeader{
  background:linear-gradient(135deg,#143552,#0e6b78);
  border-radius:20px;
  padding:18px;
  margin-bottom:12px;
}

.employeeLabel{
  font-size:11px;
  opacity:.75;
}

.employeeName{
  font-size:26px;
  font-weight:900;
  margin-top:3px;
}

.updated{
  font-size:11px;
  opacity:.7;
  margin-top:6px;
}

.summaryGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.summaryCard{
  background:#111c30;
  border-radius:17px;
  padding:15px;
  text-align:center;
}

.summaryLabel{
  font-size:11px;
  color:#8d9ab5;
}

.summaryValue{
  margin-top:5px;
  font-size:22px;
  font-weight:900;
}

.bonusCard{
  background:linear-gradient(135deg,#113c32,#12634d);
  border-radius:20px;
  padding:18px;
  text-align:center;
  margin-bottom:12px;
}

.bonusLabel{
  font-size:12px;
  opacity:.8;
}

.bonusValue{
  margin-top:5px;
  font-size:32px;
  font-weight:900;
}

.motivation{
  margin-top:8px;
  font-size:14px;
  font-weight:800;
}

.packagesTitle{
  font-size:20px;
  font-weight:900;
  margin:20px 0 10px;
}

.packageCard{
  background:#111c30;
  border-radius:17px;
  padding:15px;
  margin-bottom:9px;
}

.packageTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.packageName{
  font-size:18px;
  font-weight:900;
}

.packagePrice{
  color:#8d9ab5;
  font-size:12px;
  margin-top:3px;
}

.count{
  background:#182943;
  border-radius:11px;
  padding:9px 12px;
  font-size:20px;
  font-weight:900;
}

.packageInfo{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.infoBox{
  background:#0b1526;
  border-radius:11px;
  padding:10px;
}

.infoLabel{
  font-size:10px;
  color:#8d9ab5;
}

.infoValue{
  margin-top:4px;
  font-size:15px;
  font-weight:900;
}

.employeeBonus{
  color:#71c9ff;
}

.earned{
  color:#72efb1;
}

.downloadBtn{
  width:100%;
  border:none;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  background:#16794d;
  color:#fff;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.changeBtn{
  width:100%;
  border:none;
  border-radius:14px;
  padding:13px;
  margin-top:9px;
  background:#1a2942;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.message{
  text-align:center;
  color:#8d9ab5;
  font-size:13px;
  padding:12px;
}

.error{
  color:#ff9090;
}

@media(max-width:480px){

  .container{
    padding:14px;
  }

  h1{
    font-size:26px;
  }

  .bonusValue{
    font-size:29px;
  }

}

</style>
</head>

<body>

<div class="container">

<img
  src="./IMG_7968.png"
  class="logo"
>

<div class="header">

  <h1>
    Իմ Վաճառքները
  </h1>

  <div class="subtitle">
    Home Telecom
  </div>

</div>

<div class="dateBox">

  <div
    class="date"
    id="date"
  ></div>

  <div
    class="clock"
    id="clock"
  ></div>

</div>

<div
  class="searchCard"
  id="searchCard"
>

  <div class="searchTitle">
    Գրեք Ձեր անունը
  </div>

  <div class="searchRow">

    <input
      id="nameInput"
      class="searchInput"
      placeholder="Անուն Ազգանուն"
      autocomplete="off"
    >

    <button
      class="searchBtn"
      onclick="findEmployee()"
    >
      Բացել
    </button>

  </div>

</div>

<div
  id="message"
  class="message"
></div>

<div
  id="employeeCard"
  class="employeeCard"
>

  <div class="employeeHeader">

    <div class="employeeLabel">
      Աշխատակից
    </div>

    <div
      class="employeeName"
      id="employeeName"
    ></div>

    <div
      class="updated"
      id="updated"
    ></div>

  </div>

  <div class="summaryGrid">

    <div class="summaryCard">

      <div class="summaryLabel">
        Այսօրվա վաճառքներ
      </div>

      <div
        class="summaryValue"
        id="totalSales"
      >
        0
      </div>

    </div>

    <div class="summaryCard">

      <div class="summaryLabel">
        Ակտիվ փաթեթներ
      </div>

      <div
        class="summaryValue"
        id="activePackages"
      >
        0
      </div>

    </div>

  </div>

  <div class="bonusCard">

    <div class="bonusLabel">
      💰 Իմ այսօրվա բոնուսը
    </div>

    <div
      class="bonusValue"
      id="totalBonus"
    >
      0 դրամ
    </div>

    <div
      class="motivation"
      id="motivation"
    ></div>

  </div>

  <div class="packagesTitle">
    Իմ արդյունքները
  </div>

  <div id="packages"></div>

  <button
    class="downloadBtn"
    onclick="downloadResult()"
  >
    📥 Ներբեռնել այսօրվա արդյունքը
  </button>

  <button
    class="changeBtn"
    onclick="changeEmployee()"
  >
    Փոխել աշխատակցին
  </button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const fieldByCode = {

  home_standard:"package_6900",
  home_premium:"package_7900",
  home_ultima:"package_8900",

  inet1:"package_3900",
  inet2:"package_4900",
  inet3:"package_5900",

  iptv1:"package_iptv1",
  iptv2:"package_iptv2",
  iptv3:"package_iptv3"

};

const packageOrder = [

  "home_standard",
  "home_premium",
  "home_ultima",

  "inet1",
  "inet2",
  "inet3",

  "iptv1",
  "iptv2",
  "iptv3"

];

let currentEmployee = null;
let currentPackages = [];
let currentSales = null;
let currentDay = "";

function money(value){

  return new Intl.NumberFormat(
    "hy-AM"
  ).format(
    Math.round(
      Number(value) || 0
    )
  ) + " դրամ";

}

function localDateKey(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(
      d.getMonth()+1
    ).padStart(2,"0"),
    String(
      d.getDate()
    ).padStart(2,"0")
  ].join("-");

}

function updateClock(){

  const d = new Date();

  document.getElementById(
    "clock"
  ).textContent =
    d.toLocaleTimeString(
      "hy-AM",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  document.getElementById(
    "date"
  ).textContent =
    d.toLocaleDateString(
      "hy-AM",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

}

function getMotivation(totalBonus){

  if(totalBonus >= 40000){

    return "Դու գերազանցեցիր քեզ 🏆";

  }

  if(totalBonus >= 20000){

    return "Այ էսպես շարունակիր 🔥";

  }

  return "Սա քիչ է, ավելին կարող ես դու... 🚀";

}

function sortPackages(list){

  return [...list].sort(
    (a,b)=>
      packageOrder.indexOf(a.code)
      -
      packageOrder.indexOf(b.code)
  );

}

async function findEmployee(){

  const input =
    document.getElementById(
      "nameInput"
    );

  const name =
    input.value.trim();

  if(!name){

    showMessage(
      "Գրեք Ձեր անունը",
      true
    );

    return;

  }

  showMessage(
    "Տվյալները բեռնվում են..."
  );

  try{

    const employeeRes =
      await db
        .from("employees")
        .select("*")
        .ilike("name",name)
        .eq("active",true)
        .maybeSingle();

    if(employeeRes.error)
      throw employeeRes.error;

    if(!employeeRes.data){

      showMessage(
        "Այս անունով աշխատակից չի գտնվել",
        true
      );

      return;

    }

    currentEmployee =
      employeeRes.data;

    localStorage.setItem(
      "ht_employee_name",
      currentEmployee.name
    );

    await loadEmployeeData();

  }
  catch(error){

    console.error(error);

    showMessage(
      "Չհաջողվեց բեռնել տվյալները",
      true
    );

  }

}

async function loadEmployeeData(){

  if(!currentEmployee)
    return;

  currentDay =
    localDateKey();

  try{

    const [
      packagesRes,
      salesRes
    ] =
    await Promise.all([

      db
        .from("packages")
        .select("*"),

      db
        .from("daily_sales")
        .select("*")
        .eq(
          "employee_id",
          currentEmployee.id
        )
        .eq(
          "sale_date",
          currentDay
        )
        .maybeSingle()

    ]);

    if(packagesRes.error)
      throw packagesRes.error;

    if(salesRes.error)
      throw salesRes.error;

    currentPackages =
      sortPackages(
        packagesRes.data || []
      );

    currentSales =
      salesRes.data || null;

    renderEmployee();

  }
  catch(error){

    console.error(error);

    showMessage(
      "Տվյալները թարմացնել չհաջողվեց",
      true
    );

  }

}

function renderEmployee(){

  if(!currentEmployee)
    return;

  let totalSales = 0;
  let totalBonus = 0;
  let activePackages = 0;

  let packagesHtml = "";

  currentPackages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field)
      return;

    const count =
      currentSales
        ? Number(
            currentSales[field]
          ) || 0
        : 0;

    /*
      ԿԱՐԵՎՈՐ
      Աշխատակցի մոտ օգտագործվում է
      ՄԻԱՅՆ employee_bonus-ը։
    */

    const employeeBonus =
      Number(
        pkg.employee_bonus
      ) || 0;

    const earned =
      count * employeeBonus;

    totalSales +=
      count;

    totalBonus +=
      earned;

    if(count > 0)
      activePackages++;

    packagesHtml += `

      <div class="packageCard">

        <div class="packageTop">

          <div>

            <div class="packageName">
              ${escapeHtml(
                pkg.name || pkg.code
              )}
            </div>

            <div class="packagePrice">
              Փաթեթ՝
              ${money(pkg.price)}
            </div>

          </div>

          <div class="count">
            ${count}
          </div>

        </div>

        <div class="packageInfo">

          <div class="infoBox">

            <div class="infoLabel">
              1 վաճառքից իմ բոնուսը
            </div>

            <div class="infoValue employeeBonus">
              ${money(employeeBonus)}
            </div>

          </div>

          <div class="infoBox">

            <div class="infoLabel">
              Վաստակած բոնուս
            </div>

            <div class="infoValue earned">
              ${money(earned)}
            </div>

          </div>

        </div>

      </div>

    `;

  });

  document.getElementById(
    "employeeName"
  ).textContent =
    currentEmployee.name;

  document.getElementById(
    "totalSales"
  ).textContent =
    totalSales;

  document.getElementById(
    "activePackages"
  ).textContent =
    activePackages;

  document.getElementById(
    "totalBonus"
  ).textContent =
    money(totalBonus);

  document.getElementById(
    "motivation"
  ).textContent =
    getMotivation(totalBonus);

  document.getElementById(
    "packages"
  ).innerHTML =
    packagesHtml;

  let updatedText =
    "Այսօրվա տվյալներ";

  if(
    currentSales &&
    currentSales.updated_at
  ){

    const d =
      new Date(
        currentSales.updated_at
      );

    updatedText =
      "Թարմացված՝ " +
      d.toLocaleTimeString(
        "hy-AM",
        {
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      );

  }

  document.getElementById(
    "updated"
  ).textContent =
    updatedText;

  document.getElementById(
    "searchCard"
  ).style.display =
    "none";

  document.getElementById(
    "employeeCard"
  ).style.display =
    "block";

  showMessage("");

}

function changeEmployee(){

  localStorage.removeItem(
    "ht_employee_name"
  );

  currentEmployee = null;
  currentSales = null;

  document.getElementById(
    "employeeCard"
  ).style.display =
    "none";

  document.getElementById(
    "searchCard"
  ).style.display =
    "block";

  document.getElementById(
    "nameInput"
  ).value = "";

  showMessage("");

}

function downloadResult(){

  if(!currentEmployee)
    return;

  let totalSales = 0;
  let totalBonus = 0;

  const rows = [

    ["ՔՈ ԱՅՍՕՐՎԱ ԱՐԴՅՈՒՆՔԸ"],

    [],

    [
      "Աշխատակից",
      currentEmployee.name
    ],

    [
      "Ամսաթիվ",
      currentDay
    ],

    [],

    [
      "Փաթեթ",
      "Գին",
      "Վաճառք",
      "1 վաճառքից բոնուս",
      "Վաստակած բոնուս"
    ]

  ];

  currentPackages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field)
      return;

    const count =
      currentSales
        ? Number(
            currentSales[field]
          ) || 0
        : 0;

    const employeeBonus =
      Number(
        pkg.employee_bonus
      ) || 0;

    const earned =
      count * employeeBonus;

    totalSales +=
      count;

    totalBonus +=
      earned;

    rows.push([

      pkg.name || pkg.code,

      Number(pkg.price || 0),

      count,

      employeeBonus,

      earned

    ]);

  });

  rows.push([]);

  rows.push([
    "Ընդհանուր վաճառք",
    totalSales
  ]);

  rows.push([
    "Իմ ընդհանուր բոնուսը",
    totalBonus
  ]);

  rows.push([]);

  rows.push([
    getMotivation(totalBonus)
  ]);

  const ws =
    XLSX.utils.aoa_to_sheet(
      rows
    );

  ws["!cols"] = [
    {wch:24},
    {wch:14},
    {wch:12},
    {wch:22},
    {wch:22}
  ];

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Արդյունք"
  );

  XLSX.writeFile(
    wb,
    "Քո Այսօրվա Արդյունքը.xlsx"
  );

}

function showMessage(
  text,
  error=false
){

  const el =
    document.getElementById(
      "message"
    );

  el.textContent =
    text;

  el.className =
    error
      ? "message error"
      : "message";

}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

async function autoRefresh(){

  if(!currentEmployee)
    return;

  const newDay =
    localDateKey();

  if(newDay !== currentDay){

    currentDay =
      newDay;

  }

  await loadEmployeeData();

}

updateClock();

setInterval(
  updateClock,
  1000
);

setInterval(
  autoRefresh,
  5000
);

window.addEventListener(
  "load",
  async ()=>{

    const savedName =
      localStorage.getItem(
        "ht_employee_name"
      );

    if(savedName){

      document.getElementById(
        "nameInput"
      ).value =
        savedName;

      await findEmployee();

    }

  }
);

</script>

</body>
</html>

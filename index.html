<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>Home Telecom Sales</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#08101d">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="HT Sales"
>

<link
  rel="apple-touch-icon"
  href="./IMG_7968.png"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#08101d;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px;
}

.logo{
  display:block;
  width:220px;
  max-width:68%;
  margin:4px auto 12px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0;
  font-size:30px;
  font-weight:900;
}

.subtitle{
  margin-top:5px;
  color:#8190ad;
}

.dateBox{
  background:#111d31;
  border-radius:26px;
  padding:18px;
  margin-bottom:18px;
  text-align:center;
}

.date{
  color:#9aa7c1;
  font-size:18px;
  font-weight:700;
}

.clock{
  margin-top:6px;
  color:#fff;
  font-size:20px;
  font-weight:900;
}

.searchCard{
  background:#111d31;
  border-radius:24px;
  padding:18px;
  margin-bottom:18px;
}

.searchTitle{
  color:#9aa7c1;
  font-size:14px;
  margin-bottom:9px;
}

.searchRow{
  display:flex;
  gap:8px;
}

.searchInput{
  flex:1;
  min-width:0;
  border:1px solid #293853;
  border-radius:13px;
  padding:14px;
  background:#091526;
  color:white;
  font-size:16px;
  outline:none;
}

.searchBtn{
  border:none;
  border-radius:13px;
  padding:0 18px;
  background:#249fd4;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.employeeArea{
  display:none;
}

.employeeHeader{
  background:#111d31;
  border-radius:26px;
  padding:20px;
  margin-bottom:18px;
}

.employeeLabel{
  color:#8d9ab5;
  font-size:13px;
}

.employeeName{
  margin-top:4px;
  font-size:29px;
  font-weight:900;
}

.updated{
  color:#8d9ab5;
  font-size:12px;
  margin-top:7px;
}

.summaryCard{
  background:#111d31;
  border-radius:26px;
  padding:24px 18px;
  text-align:center;
  margin-bottom:18px;
}

.summaryLabel{
  color:#8d9ab5;
  font-size:15px;
  font-weight:700;
}

.summaryValue{
  font-size:36px;
  font-weight:900;
  margin-top:8px;
}

.bonusCard{
  background:linear-gradient(
    135deg,
    #164963,
    #12747c
  );
  border-radius:30px;
  padding:27px 18px;
  text-align:center;
  margin-bottom:25px;
}

.bonusLabel{
  color:#dceaf0;
  font-size:16px;
  font-weight:700;
}

.bonusValue{
  margin-top:8px;
  font-size:40px;
  font-weight:900;
}

.motivation{
  margin-top:14px;
  font-size:17px;
  font-weight:900;
}

.packagesTitle{
  margin:22px 0 14px;
  font-size:29px;
  font-weight:900;
}

.packageCard{
  background:#111d31;
  border-radius:27px;
  padding:20px;
  margin-bottom:14px;
}

.packageTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
}

.packageName{
  font-size:23px;
  font-weight:900;
}

.packagePrice{
  margin-top:5px;
  color:#8190ad;
  font-size:16px;
  font-weight:700;
}

.countBox{
  min-width:92px;
  background:#091526;
  border-radius:22px;
  padding:14px 12px;
  text-align:center;
}

.countNumber{
  font-size:31px;
  font-weight:900;
}

.countLabel{
  margin-top:2px;
  color:#8190ad;
  font-size:13px;
  font-weight:700;
}

.packageBottom{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:15px;
  margin-top:18px;
}

.oneSale{
  color:#8d9ab5;
  font-size:16px;
  font-weight:700;
}

.earned{
  text-align:right;
  color:#6eedb5;
  font-size:18px;
  font-weight:900;
}

.downloadBtn{
  width:100%;
  border:none;
  border-radius:16px;
  padding:16px;
  margin-top:14px;
  background:#17794d;
  color:#fff;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.changeBtn{
  width:100%;
  border:none;
  border-radius:16px;
  padding:14px;
  margin-top:10px;
  background:#192941;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.message{
  text-align:center;
  color:#8d9ab5;
  padding:12px 5px;
  font-size:13px;
}

.error{
  color:#ff9292;
}

@media(max-width:500px){

  .container{
    padding:14px;
  }

  .header h1{
    font-size:27px;
  }

  .packagesTitle{
    font-size:26px;
  }

  .packageName{
    font-size:21px;
  }

  .bonusValue{
    font-size:36px;
  }

}

</style>
</head>

<body>

<div class="container">

<img
  src="./IMG_7968.png"
  class="logo"
>

<div class="header">

  <h1>
    Իմ Վաճառքները
  </h1>

  <div class="subtitle">
    Home Telecom
  </div>

</div>

<div class="dateBox">

  <div
    class="date"
    id="date"
  ></div>

  <div
    class="clock"
    id="clock"
  ></div>

</div>

<div
  class="searchCard"
  id="searchCard"
>

  <div class="searchTitle">
    Գրեք Ձեր անունը
  </div>

  <div class="searchRow">

    <input
      id="nameInput"
      class="searchInput"
      placeholder="Անուն Ազգանուն"
      autocomplete="off"
    >

    <button
      class="searchBtn"
      onclick="findEmployee()"
    >
      Բացել
    </button>

  </div>

</div>

<div
  id="message"
  class="message"
></div>

<div
  id="employeeArea"
  class="employeeArea"
>

  <div class="employeeHeader">

    <div class="employeeLabel">
      Աշխատակից
    </div>

    <div
      class="employeeName"
      id="employeeName"
    ></div>

    <div
      class="updated"
      id="updated"
    ></div>

  </div>


  <div class="summaryCard">

    <div class="summaryLabel">
      Ընդհանուր վաճառք
    </div>

    <div
      class="summaryValue"
      id="totalSales"
    >
      0
    </div>

  </div>


  <div class="summaryCard">

    <div class="summaryLabel">
      Փաթեթների տեսակներ
    </div>

    <div
      class="summaryValue"
      id="packageTypes"
    >
      9
    </div>

  </div>


  <div class="bonusCard">

    <div class="bonusLabel">
      Այսօրվա բոնուսը
    </div>

    <div
      class="bonusValue"
      id="totalBonus"
    >
      0 դրամ
    </div>

    <div
      class="motivation"
      id="motivation"
    ></div>

  </div>


  <div class="packagesTitle">
    Այսօրվա վաճառքները
  </div>

  <div id="packages"></div>


  <button
    class="downloadBtn"
    onclick="downloadResult()"
  >
    📥 Ներբեռնել այսօրվա արդյունքը
  </button>


  <button
    class="changeBtn"
    onclick="changeEmployee()"
  >
    Փոխել աշխատակցին
  </button>

</div>

</div>


<script>

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const fieldByCode = {

  home_standard:
    "package_6900",

  home_premium:
    "package_7900",

  home_ultima:
    "package_8900",

  inet1:
    "package_3900",

  inet2:
    "package_4900",

  inet3:
    "package_5900",

  iptv1:
    "package_iptv1",

  iptv2:
    "package_iptv2",

  iptv3:
    "package_iptv3"

};


const packageOrder = [

  "home_standard",
  "home_premium",
  "home_ultima",

  "inet1",
  "inet2",
  "inet3",

  "iptv1",
  "iptv2",
  "iptv3"

];


let currentEmployee = null;
let currentPackages = [];
let currentSales = null;
let currentDay = "";


function money(value){

  return new Intl.NumberFormat(
    "hy-AM"
  ).format(
    Math.round(
      Number(value) || 0
    )
  ) + " դրամ";

}


function localDateKey(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(
      d.getMonth()+1
    ).padStart(2,"0"),
    String(
      d.getDate()
    ).padStart(2,"0")
  ].join("-");

}


function updateClock(){

  const d = new Date();

  document.getElementById(
    "clock"
  ).textContent =
    d.toLocaleTimeString(
      "hy-AM",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  document.getElementById(
    "date"
  ).textContent =
    d.toLocaleDateString(
      "hy-AM",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

}


function getMotivation(totalBonus){

  if(totalBonus >= 40000){

    return "Դու գերազանցեցիր քեզ 🏆";

  }

  if(totalBonus >= 20000){

    return "Այ էսպես շարունակիր 🔥";

  }

  return "Սա քիչ է, ավելին կարող ես դու... 🚀";

}


function sortPackages(list){

  return [...list].sort(
    (a,b)=>
      packageOrder.indexOf(a.code)
      -
      packageOrder.indexOf(b.code)
  );

}


async function findEmployee(){

  const input =
    document.getElementById(
      "nameInput"
    );

  const name =
    input.value.trim();

  if(!name){

    showMessage(
      "Գրեք Ձեր անունը",
      true
    );

    return;

  }

  showMessage(
    "Տվյալները բեռնվում են..."
  );

  try{

    const employeeRes =
      await db
        .from("employees")
        .select("*")
        .ilike("name",name)
        .eq("active",true)
        .maybeSingle();

    if(employeeRes.error){
      throw employeeRes.error;
    }

    if(!employeeRes.data){

      showMessage(
        "Այս անունով աշխատակից չի գտնվել",
        true
      );

      return;

    }

    currentEmployee =
      employeeRes.data;

    localStorage.setItem(
      "ht_employee_name",
      currentEmployee.name
    );

    await loadEmployeeData();

  }
  catch(error){

    console.error(error);

    showMessage(
      "Չհաջողվեց բեռնել տվյալները",
      true
    );

  }

}


async function loadEmployeeData(){

  if(!currentEmployee){
    return;
  }

  currentDay =
    localDateKey();

  try{

    const [
      packagesRes,
      salesRes
    ] =
    await Promise.all([

      db
        .from("packages")
        .select("*"),

      db
        .from("daily_sales")
        .select("*")
        .eq(
          "employee_id",
          currentEmployee.id
        )
        .eq(
          "sale_date",
          currentDay
        )
        .maybeSingle()

    ]);

    if(packagesRes.error){
      throw packagesRes.error;
    }

    if(salesRes.error){
      throw salesRes.error;
    }

    currentPackages =
      sortPackages(
        packagesRes.data || []
      );

    currentSales =
      salesRes.data || null;

    renderEmployee();

  }
  catch(error){

    console.error(error);

    showMessage(
      "Տվյալները թարմացնել չհաջողվեց",
      true
    );

  }

}


function renderEmployee(){

  if(!currentEmployee){
    return;
  }

  let totalSales = 0;
  let totalBonus = 0;

  let packagesHtml = "";


  currentPackages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field){
      return;
    }


    const count =
      currentSales
        ?
        Number(
          currentSales[field]
        ) || 0
        :
        0;


    /*
      ԱՅՍՏԵՂ ՕԳՏԱԳՈՐԾՎՈՒՄ Է
      ՄԻԱՅՆ ԱՇԽԱՏԱԿՑԻ ԲՈՆՈՒՍԸ
    */

    const employeeBonus =
      Number(
        pkg.employee_bonus
      ) || 0;


    const earned =
      count *
      employeeBonus;


    totalSales +=
      count;


    totalBonus +=
      earned;


    packagesHtml += `

      <div class="packageCard">

        <div class="packageTop">

          <div>

            <div class="packageName">

              ${escapeHtml(
                pkg.name || pkg.code
              )}

            </div>

            <div class="packagePrice">

              ${money(pkg.price)}

            </div>

          </div>


          <div class="countBox">

            <div class="countNumber">

              ${count}

            </div>

            <div class="countLabel">

              վաճառք

            </div>

          </div>

        </div>


        <div class="packageBottom">

          <div class="oneSale">

            1 վաճառքից՝
            ${money(employeeBonus)}

          </div>


          <div class="earned">

            + ${money(earned)}

          </div>

        </div>

      </div>

    `;

  });


  document.getElementById(
    "employeeName"
  ).textContent =
    currentEmployee.name;


  document.getElementById(
    "totalSales"
  ).textContent =
    totalSales;


  document.getElementById(
    "packageTypes"
  ).textContent =
    currentPackages.length;


  document.getElementById(
    "totalBonus"
  ).textContent =
    money(totalBonus);


  document.getElementById(
    "motivation"
  ).textContent =
    getMotivation(
      totalBonus
    );


  document.getElementById(
    "packages"
  ).innerHTML =
    packagesHtml;


  let updatedText =
    "Այսօրվա տվյալներ";


  if(
    currentSales &&
    currentSales.updated_at
  ){

    const d =
      new Date(
        currentSales.updated_at
      );

    updatedText =
      "Թարմացված՝ " +
      d.toLocaleTimeString(
        "hy-AM",
        {
          hour:"2-digit",
          minute:"2-digit",
          hour12:false
        }
      );

  }


  document.getElementById(
    "updated"
  ).textContent =
    updatedText;


  document.getElementById(
    "searchCard"
  ).style.display =
    "none";


  document.getElementById(
    "employeeArea"
  ).style.display =
    "block";


  showMessage("");

}


function changeEmployee(){

  localStorage.removeItem(
    "ht_employee_name"
  );

  currentEmployee = null;
  currentSales = null;

  document.getElementById(
    "employeeArea"
  ).style.display =
    "none";

  document.getElementById(
    "searchCard"
  ).style.display =
    "block";

  document.getElementById(
    "nameInput"
  ).value =
    "";

  showMessage("");

}


function downloadResult(){

  if(!currentEmployee){
    return;
  }

  let totalSales = 0;
  let totalBonus = 0;


  const rows = [

    [
      "ՔՈ ԱՅՍՕՐՎԱ ԱՐԴՅՈՒՆՔԸ"
    ],

    [],

    [
      "Աշխատակից",
      currentEmployee.name
    ],

    [
      "Ամսաթիվ",
      currentDay
    ],

    [],

    [
      "Փաթեթ",
      "Գին",
      "Վաճառք",
      "1 վաճառքից բոնուս",
      "Վաստակած բոնուս"
    ]

  ];


  currentPackages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field){
      return;
    }


    const count =
      currentSales
        ?
        Number(
          currentSales[field]
        ) || 0
        :
        0;


    const employeeBonus =
      Number(
        pkg.employee_bonus
      ) || 0;


    const earned =
      count *
      employeeBonus;


    totalSales +=
      count;


    totalBonus +=
      earned;


    rows.push([

      pkg.name || pkg.code,

      Number(
        pkg.price || 0
      ),

      count,

      employeeBonus,

      earned

    ]);

  });


  rows.push([]);


  rows.push([

    "Ընդհանուր վաճառք",

    totalSales

  ]);


  rows.push([

    "Իմ ընդհանուր բոնուսը",

    totalBonus

  ]);


  rows.push([]);


  rows.push([

    getMotivation(
      totalBonus
    )

  ]);


  const ws =
    XLSX.utils.aoa_to_sheet(
      rows
    );


  ws["!cols"] = [

    {wch:24},
    {wch:14},
    {wch:12},
    {wch:22},
    {wch:22}

  ];


  const wb =
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Արդյունք"
  );


  XLSX.writeFile(
    wb,
    "Քո Այսօրվա Արդյունքը.xlsx"
  );

}


function showMessage(
  text,
  isError=false
){

  const el =
    document.getElementById(
      "message"
    );

  el.textContent =
    text;

  el.className =
    isError
      ?
      "message error"
      :
      "message";

}


function escapeHtml(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


async function autoRefresh(){

  if(!currentEmployee){
    return;
  }


  const newDay =
    localDateKey();


  if(
    newDay !== currentDay
  ){

    currentDay =
      newDay;

  }


  await loadEmployeeData();

}


updateClock();


setInterval(
  updateClock,
  1000
);


setInterval(
  autoRefresh,
  5000
);


window.addEventListener(
  "load",
  async ()=>{

    const savedName =
      localStorage.getItem(
        "ht_employee_name"
      );


    if(savedName){

      document.getElementById(
        "nameInput"
      ).value =
        savedName;


      await findEmployee();

    }

  }
);

</script>

</body>
</html>

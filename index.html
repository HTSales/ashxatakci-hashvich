<!DOCTYPE html>
<html lang="hy">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>Home Telecom Sales</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#08101d">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<link
  rel="apple-touch-icon"
  href="./IMG_7968.png"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  background:#08101d;

  color:#fff;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Arial,
  sans-serif;

}

.container{

  max-width:700px;

  margin:auto;

  padding:18px;

}

.logo{

  display:block;

  width:190px;

  max-width:65%;

  margin:8px auto 10px;

}

.title{

  text-align:center;

  font-size:28px;

  font-weight:900;

}

.sub{

  text-align:center;

  color:#8794aa;

  margin-top:5px;

}


.loginBox{

  background:#111c30;

  border-radius:22px;

  padding:18px;

  margin-top:20px;

}

.loginTitle{

  font-size:20px;

  font-weight:900;

}

.loginInfo{

  color:#8c99ad;

  line-height:1.5;

  font-size:13px;

  margin-top:7px;

}

.input{

  width:100%;

  margin-top:12px;

  padding:14px;

  background:#0b1526;

  color:white;

  border:1px solid #31405a;

  border-radius:12px;

  font-size:17px;

}

.loginBtn{

  width:100%;

  border:0;

  border-radius:12px;

  padding:14px;

  margin-top:10px;

  background:#1fa471;

  color:white;

  font-size:16px;

  font-weight:900;

}

.backBtn{

  width:100%;

  border:0;

  border-radius:12px;

  padding:12px;

  margin-top:8px;

  background:#1b2941;

  color:white;

  font-weight:900;

}


.dateBox{

  background:#111c30;

  border-radius:18px;

  padding:14px;

  text-align:center;

  margin-top:15px;

}

.date{

  color:#69e7b8;

  font-weight:900;

  font-size:18px;

}

.clock{

  color:#8794aa;

  margin-top:5px;

}


.employeeCard{

  background:#111c30;

  border-radius:22px;

  padding:18px;

  margin-top:12px;

}

.employeeName{

  font-size:29px;

  font-weight:900;

}

.totalBonus{

  margin-top:13px;

  background:
  linear-gradient(
    135deg,
    #104232,
    #12654b
  );

  border-radius:18px;

  padding:16px;

}

.totalLabel{

  opacity:.8;

  font-size:13px;

}

.totalValue{

  font-size:32px;

  font-weight:900;

  margin-top:5px;

}

.salesCount{

  color:#7dffbb;

  font-weight:900;

  margin-top:6px;

}

.motivation{

  margin-top:12px;

  background:#17253c;

  border-radius:15px;

  padding:13px;

  font-weight:900;

}


.packages{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:14px;

}

.package{

  background:#0b1526;

  border-radius:15px;

  padding:13px;

}

.packageName{

  font-size:16px;

  font-weight:900;

}

.price{

  color:#8492a8;

  font-size:12px;

  margin-top:3px;

}

.oneSale{

  color:#66caff;

  font-size:12px;

  margin-top:8px;

}

.count{

  font-size:22px;

  font-weight:900;

  margin-top:8px;

}

.earned{

  color:#6ceeb0;

  font-weight:900;

  font-size:12px;

  margin-top:4px;

}

.logout{

  margin-top:15px;

  width:100%;

  border:0;

  border-radius:12px;

  padding:13px;

  background:#24334b;

  color:white;

  font-weight:900;

}

.status{

  text-align:center;

  color:#8794aa;

  font-size:12px;

  margin-top:12px;

}


@media(max-width:450px){

  .packages{

    grid-template-columns:
      1fr;

  }

}

</style>

</head>


<body>


<div class="container">


<img
  src="./IMG_7968.png"
  class="logo"
>


<div class="title">

Իմ Վաճառքները

</div>


<div class="sub">

Home Telecom

</div>



<div id="loginArea">

<div class="loginBox">

<div class="loginTitle">

Մուտք

</div>

<div
  class="loginInfo"
  id="loginInfo"
>

Գրիր քո անունը

</div>


<input
  class="input"
  id="nameInput"
  placeholder="Անուն"
/>


<div id="codeArea"></div>


<button
  class="loginBtn"
  onclick="checkName()"
  id="mainButton"
>

Շարունակել

</button>

</div>

</div>



<div
  id="resultArea"
  style="display:none"
>

<div class="dateBox">

<div
  class="date"
  id="dateText"
></div>

<div
  class="clock"
  id="clockText"
></div>

</div>


<div
  id="employeeResult"
></div>


<button
  class="logout"
  onclick="logout()"
>

Դուրս գալ

</button>

</div>


<div
  class="status"
  id="status"
></div>


</div>



<script>


const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";


const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";


const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



const fieldByCode = {

  home_standard:
  "package_6900",

  home_premium:
  "package_7900",

  home_ultima:
  "package_8900",

  inet1:
  "package_3900",

  inet2:
  "package_4900",

  inet3:
  "package_5900",

  iptv1:
  "package_iptv1",

  iptv2:
  "package_iptv2",

  iptv3:
  "package_iptv3"

};


const packageOrder = [

  "home_standard",

  "home_premium",

  "home_ultima",

  "inet1",

  "inet2",

  "inet3",

  "iptv1",

  "iptv2",

  "iptv3"

];


let employee=null;

let packages=[];

let currentDate="";

let mode="name";


function money(v){

  return new Intl.NumberFormat(
    "hy-AM"
  ).format(
    Math.round(Number(v)||0)
  )+" դրամ";

}


function todayKey(){

  const parts=
  new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Asia/Yerevan",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).formatToParts(new Date());

  const map={};

  parts.forEach(x=>{
    map[x.type]=x.value;
  });

  return `${map.year}-${map.month}-${map.day}`;
}


function updateClock(){

  const now=new Date();

  if(
    document.getElementById(
      "dateText"
    )
  ){

    dateText.textContent=
    now.toLocaleDateString(
      "hy-AM",
      {
        timeZone:"Asia/Yerevan",
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

    clockText.textContent=
    now.toLocaleTimeString(
      "hy-AM",
      {
        timeZone:"Asia/Yerevan",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  }
}


async function checkName(){

  if(mode==="code"){

    loginWithCode();
    return;

  }

  if(mode==="create"){

    createCode();
    return;

  }


  const name=
    nameInput.value.trim();


  if(!name){

    alert("Գրիր անունը");

    return;

  }


  status.textContent=
    "Ստուգվում է...";


  const result=
  await db
  .from("employees")
  .select("*")
  .eq("active",true)
  .ilike("name",name)
  .maybeSingle();


  if(result.error){

    console.error(result.error);

    status.textContent=
      "Սխալ առաջացավ";

    return;

  }


  if(!result.data){

    alert(
      "Այդ անունով աշխատակից չկա"
    );

    status.textContent="";

    return;

  }


  employee=result.data;


  nameInput.disabled=true;


  if(
    !employee.access_code
  ){

    mode="create";

    loginInfo.textContent=
      "Առաջին մուտքն է։ Ստեղծիր քո անձնական կոդը։ Հետագայում միշտ այս կոդով ես մտնելու։";

    codeArea.innerHTML=`

      <input
        class="input"
        id="codeInput"
        type="password"
        inputmode="numeric"
        placeholder="Ստեղծիր կոդ"
      >

    `;

    mainButton.textContent=
      "Ստեղծել կոդ և մուտք գործել";

  }

  else{

    mode="code";

    loginInfo.textContent=
      "Մուտքագրիր քո անձնական կոդը";

    codeArea.innerHTML=`

      <input
        class="input"
        id="codeInput"
        type="password"
        inputmode="numeric"
        placeholder="Քո կոդը"
      >

    `;

    mainButton.textContent=
      "Մուտք գործել";

  }


  status.textContent="";

}


async function createCode(){

  const code=
    document.getElementById(
      "codeInput"
    ).value.trim();


  if(code.length<4){

    alert(
      "Կոդը թող լինի առնվազն 4 նիշ"
    );

    return;

  }


  /*
    Կրկին ստուգում ենք՝
    արդյոք ուրիշ սարքից կոդ չի ստեղծվել
    այս ընթացքում։
  */

  const check=
  await db
  .from("employees")
  .select("access_code")
  .eq("id",employee.id)
  .single();


  if(check.error){

    alert(
      "Չհաջողվեց ստուգել"
    );

    return;

  }


  if(check.data.access_code){

    employee.access_code=
      check.data.access_code;

    mode="code";

    alert(
      "Քո կոդն արդեն ստեղծված է։ Մուտքագրիր այդ կոդը։"
    );

    loginInfo.textContent=
      "Մուտքագրիր քո անձնական կոդը";

    codeInput.value="";

    mainButton.textContent=
      "Մուտք գործել";

    return;

  }


  const result=
  await db
  .from("employees")
  .update({
    access_code:code
  })
  .eq("id",employee.id)
  .is("access_code",null)
  .select()
  .maybeSingle();


  if(result.error){

    console.error(
      result.error
    );

    alert(
      "Կոդը պահպանել չհաջողվեց"
    );

    return;

  }


  if(!result.data){

    alert(
      "Կոդն արդեն ստեղծվել է։ Մուտքագրիր քո կոդը։"
    );

    mode="code";

    mainButton.textContent=
      "Մուտք գործել";

    return;

  }


  employee=
    result.data;


  localStorage.setItem(
    "ht_employee_name",
    employee.name
  );


  openAccount();

}


async function loginWithCode(){

  const code=
    document.getElementById(
      "codeInput"
    ).value.trim();


  if(!code){

    alert(
      "Գրիր կոդը"
    );

    return;

  }


  /*
    Նորից բազայից ենք ստուգում։
  */

  const result=
  await db
  .from("employees")
  .select("*")
  .eq("id",employee.id)
  .eq("active",true)
  .single();


  if(result.error){

    alert(
      "Չհաջողվեց մուտք գործել"
    );

    return;

  }


  if(
    String(
      result.data.access_code
    ) !==
    String(code)
  ){

    alert(
      "Կոդը սխալ է"
    );

    return;

  }


  employee=result.data;


  localStorage.setItem(
    "ht_employee_name",
    employee.name
  );


  openAccount();

}


async function openAccount(){

  loginArea.style.display=
    "none";

  resultArea.style.display=
    "block";

  currentDate=todayKey();

  await loadResult();

  updateClock();

}


async function loadResult(){

  if(!employee)return;


  currentDate=todayKey();


  const [
    pkgResult,
    salesResult
  ] =
  await Promise.all([

    db
    .from("packages")
    .select("*"),

    db
    .from("daily_sales")
    .select("*")
    .eq(
      "employee_id",
      employee.id
    )
    .eq(
      "sale_date",
      currentDate
    )
    .maybeSingle()

  ]);


  if(pkgResult.error){

    status.textContent=
      "Փաթեթները բեռնել չհաջողվեց";

    return;

  }


  if(salesResult.error){

    status.textContent=
      "Վաճառքները բեռնել չհաջողվեց";

    return;

  }


  packages=
  (pkgResult.data||[])
  .sort(
    (a,b)=>
    packageOrder.indexOf(a.code)-
    packageOrder.indexOf(b.code)
  );


  renderResult(
    salesResult.data
  );


  status.textContent=
    "● Թարմացված է";

}


function renderResult(row){

  let sales=0;

  let bonus=0;

  let packagesHTML="";


  packages.forEach(pkg=>{

    const field=
      fieldByCode[pkg.code];


    if(!field)return;


    const count=
      Number(
        row ? row[field] : 0
      )||0;


    /*
      Աշխատակցի էջը օգտագործում է
      ՄԻԱՅՆ employee_bonus-ը։
    */

    const perSale=
      Number(
        pkg.employee_bonus
      )||0;


    const earned=
      count * perSale;


    sales += count;

    bonus += earned;


    packagesHTML+=`

      <div class="package">

        <div class="packageName">
          ${escapeHTML(
            pkg.name||pkg.code
          )}
        </div>

        <div class="price">
          ${money(pkg.price)}
        </div>

        <div class="oneSale">
          1 վաճառքից՝
          ${money(perSale)}
        </div>

        <div class="count">
          ${count}
        </div>

        <div class="earned">
          +${money(earned)}
        </div>

      </div>

    `;

  });


  let motivation="";


  if(bonus<20000){

    motivation=
      "Սա քիչ է, ավելին կարող ես դու... 🚀";

  }
  else if(bonus<40000){

    motivation=
      "Այ էսպես շարունակիր 🔥";

  }
  else{

    motivation=
      "Դու գերազանցեցիր քեզ 🏆";

  }


  employeeResult.innerHTML=`

    <div class="employeeCard">

      <div class="employeeName">

        ${escapeHTML(
          employee.name
        )}

      </div>


      <div class="totalBonus">

        <div class="totalLabel">
          Այսօրվա քո բոնուսը
        </div>

        <div class="totalValue">
          ${money(bonus)}
        </div>

        <div class="salesCount">
          ${sales} վաճառք
        </div>

      </div>


      <div class="motivation">
        ${motivation}
      </div>


      <div class="packages">
        ${packagesHTML}
      </div>

    </div>

  `;

}


function logout(){

  employee=null;

  mode="name";

  nameInput.disabled=false;

  nameInput.value="";

  codeArea.innerHTML="";

  loginInfo.textContent=
    "Գրիր քո անունը";

  mainButton.textContent=
    "Շարունակել";

  loginArea.style.display=
    "block";

  resultArea.style.display=
    "none";

  status.textContent="";

}


function escapeHTML(t){

  return String(t)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/*
  Եթե նախկինում անունը գրել է,
  հաջորդ անգամ անունը ավտոմատ լրացվում է։
*/

const savedName=
localStorage.getItem(
  "ht_employee_name"
);


if(savedName){

  nameInput.value=
    savedName;

}


setInterval(
  updateClock,
  1000
);


setInterval(
  ()=>{

    if(employee){

      const newDate=
        todayKey();

      if(
        newDate !==
        currentDate
      ){

        loadResult();

      }

    }

  },
  5000
);


/*
  Բացված ժամանակ ավտոմատ թարմացում։
*/

setInterval(
  ()=>{

    if(employee){

      loadResult();

    }

  },
  5000
);


</script>

</body>

</html>

<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Իմ Վաճառքները</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.logo{
  display:block;
  width:220px;
  max-width:70%;
  margin:8px auto 18px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

h1{
  margin:5px 0;
  font-size:28px;
}

.subtitle{
  color:#8e9ab3;
  font-size:14px;
}

.searchBox{
  background:#111c30;
  border-radius:20px;
  padding:16px;
  margin-bottom:18px;
}

.nameInput{
  width:100%;
  border:1px solid #2a3a55;
  border-radius:13px;
  background:#0c1526;
  color:white;
  padding:15px;
  font-size:17px;
  outline:none;
  margin-bottom:10px;
}

.searchButton{
  width:100%;
  border:0;
  border-radius:13px;
  background:#25a8df;
  color:white;
  font-size:16px;
  font-weight:900;
  padding:15px;
}

.status{
  text-align:center;
  margin:12px 0;
  font-size:13px;
  color:#8e9ab3;
}

.employeeName{
  font-size:23px;
  font-weight:900;
  margin-bottom:12px;
}

.summary{
  background:linear-gradient(135deg,#142b4a,#0c739e);
  border-radius:20px;
  padding:17px;
  margin-bottom:15px;
}

.summaryTitle{
  font-size:12px;
  opacity:.75;
}

.summaryValue{
  font-size:28px;
  font-weight:900;
  margin-top:5px;
}

.summaryGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.summaryItem{
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:12px;
}

.small{
  font-size:11px;
  opacity:.7;
}

.value{
  font-size:17px;
  font-weight:900;
  margin-top:4px;
}

.package{
  background:#111c30;
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
}

.packageTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.packagePrice{
  font-size:19px;
  font-weight:900;
}

.count{
  background:#172238;
  border-radius:11px;
  min-width:64px;
  text-align:center;
  padding:10px;
  font-size:20px;
  font-weight:900;
}

.packageInfo{
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.infoBox{
  background:#0c1526;
  border-radius:11px;
  padding:10px;
}

.infoLabel{
  color:#8391ab;
  font-size:11px;
}

.infoValue{
  font-size:15px;
  font-weight:800;
  margin-top:4px;
}

.earned{
  color:#62e9b8;
}

.hidden{
  display:none;
}

.notFound{
  background:#311c27;
  color:#ff9baa;
  border-radius:14px;
  padding:14px;
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

<img src="IMG_7968.png" class="logo">

<div class="header">
  <h1>Իմ Վաճառքները</h1>
  <div class="subtitle">
    Գրեք ձեր անունը և տեսեք ձեր արդյունքը
  </div>
</div>

<div class="searchBox">

  <input
    id="nameInput"
    class="nameInput"
    type="text"
    placeholder="Գրեք ձեր անունը"
    autocomplete="off"
  >

  <button
    class="searchButton"
    onclick="findEmployee()"
  >
    Տեսնել իմ արդյունքը
  </button>

</div>

<div id="status" class="status"></div>

<div id="result" class="hidden">

  <div class="employeeName" id="employeeName"></div>

  <div class="summary">

    <div class="summaryTitle">
      Ընդհանուր ստացած բոնուս
    </div>

    <div class="summaryValue" id="totalBonus">
      0 դրամ
    </div>

    <div class="summaryGrid">

      <div class="summaryItem">
        <div class="small">
          Ընդհանուր վաճառք
        </div>

        <div class="value" id="totalSales">
          0
        </div>
      </div>

      <div class="summaryItem">
        <div class="small">
          Վերջին թարմացում
        </div>

        <div class="value" id="updatedTime">
          —
        </div>
      </div>

    </div>

  </div>

  <div id="packages"></div>

</div>

<div id="notFound" class="notFound hidden">
  Այս անունով աշխատակից չի գտնվել
</div>

</div>

<script>

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentName = "";
let refreshTimer = null;

function money(n){
  return new Intl.NumberFormat("hy-AM")
    .format(Number(n)||0) + " դրամ";
}

function escapeHtml(text){
  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function setStatus(text){
  document.getElementById("status").textContent=text;
}

async function findEmployee(){

  const input=
    document.getElementById("nameInput")
    .value.trim();

  if(!input){

    setStatus("Գրեք ձեր անունը");

    return;
  }

  currentName=input;

  localStorage.setItem(
    "employeeName",
    input
  );

  await loadEmployee(
    input,
    true
  );

  if(refreshTimer){
    clearInterval(refreshTimer);
  }

  refreshTimer=setInterval(
    async ()=>{
      if(currentName){
        await loadEmployee(
          currentName,
          false
        );
      }
    },
    5000
  );
}

async function loadEmployee(
  name,
  showLoading=true
){

  if(showLoading){
    setStatus("Բեռնում է...");
  }

  try{

    const [
      employeeResponse,
      packagesResponse
    ] = await Promise.all([

      db
        .from("employees")
        .select("*")
        .ilike("name",name)
        .maybeSingle(),

      db
        .from("packages")
        .select("price,bonus")
        .order("price")
    ]);

    if(employeeResponse.error){
      throw employeeResponse.error;
    }

    if(packagesResponse.error){
      throw packagesResponse.error;
    }

    const employee=
      employeeResponse.data;

    const packages=
      packagesResponse.data || [];

    if(!employee){

      document
        .getElementById("result")
        .classList.add("hidden");

      document
        .getElementById("notFound")
        .classList.remove("hidden");

      setStatus("");

      return;
    }

    document
      .getElementById("notFound")
      .classList.add("hidden");

    renderEmployee(
      employee,
      packages
    );

    setStatus(
      "● Տվյալները թարմացված են"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Չհաջողվեց բեռնել տվյալները"
    );
  }
}

function renderEmployee(
  employee,
  packages
){

  const result=
    document.getElementById("result");

  result.classList.remove("hidden");

  document.getElementById(
    "employeeName"
  ).textContent=
    employee.name;

  let totalSales=0;
  let totalBonus=0;

  let html="";

  packages.forEach(p=>{

    const field=
      "package_"+p.price;

    const count=
      Number(employee[field])||0;

    const bonus=
      Number(p.bonus)||0;

    const earned=
      count*bonus;

    totalSales+=count;
    totalBonus+=earned;

    html+=`

      <div class="package">

        <div class="packageTop">

          <div class="packagePrice">
            ${money(p.price)}
          </div>

          <div class="count">
            ${count}
          </div>

        </div>

        <div class="packageInfo">

          <div class="infoBox">

            <div class="infoLabel">
              1 վաճառքից
            </div>

            <div class="infoValue">
              ${money(bonus)}
            </div>

          </div>

          <div class="infoBox">

            <div class="infoLabel">
              Ստացած բոնուս
            </div>

            <div class="infoValue earned">
              ${money(earned)}
            </div>

          </div>

        </div>

      </div>
    `;
  });

  document.getElementById(
    "packages"
  ).innerHTML=html;

  document.getElementById(
    "totalSales"
  ).textContent=
    totalSales;

  document.getElementById(
    "totalBonus"
  ).textContent=
    money(totalBonus);

  document.getElementById(
    "updatedTime"
  ).textContent=
    new Date().toLocaleTimeString(
      "hy-AM",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}

/* ENTER */

document.getElementById(
  "nameInput"
).addEventListener(
  "keydown",
  function(event){

    if(event.key==="Enter"){
      findEmployee();
    }
  }
);

/* REMEMBER NAME */

window.addEventListener(
  "load",
  async ()=>{

    const saved=
      localStorage.getItem(
        "employeeName"
      );

    if(saved){

      document.getElementById(
        "nameInput"
      ).value=saved;

      currentName=saved;

      await loadEmployee(
        saved,
        true
      );

      refreshTimer=setInterval(
        async ()=>{
          if(currentName){
            await loadEmployee(
              currentName,
              false
            );
          }
        },
        5000
      );
    }
  }
);

</script>

</body>
</html>

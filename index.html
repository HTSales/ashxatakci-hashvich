<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Իմ Վաճառքները</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.logo{
  display:block;
  width:230px;
  max-width:75%;
  margin:8px auto 18px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

h1{
  margin:0 0 7px;
  font-size:28px;
}

.subtitle{
  color:#8e9ab3;
  font-size:14px;
}

.searchBox{
  background:#111c30;
  border-radius:20px;
  padding:16px;
  margin-bottom:15px;
}

.nameInput{
  width:100%;
  border:1px solid #2a3a55;
  border-radius:13px;
  background:#0c1526;
  color:#fff;
  padding:15px;
  font-size:17px;
  outline:none;
  margin-bottom:10px;
}

.searchButton{
  width:100%;
  border:0;
  border-radius:13px;
  background:#25a8df;
  color:#fff;
  padding:15px;
  font-size:16px;
  font-weight:900;
}

.status{
  text-align:center;
  min-height:20px;
  margin:10px 0;
  font-size:13px;
  color:#8e9ab3;
}

.welcome{
  background:linear-gradient(135deg,#162842,#101b2e);
  border-radius:20px;
  padding:17px;
  margin-bottom:14px;
}

.employeeName{
  font-size:25px;
  font-weight:900;
}

.motivation{
  margin-top:7px;
  color:#62e9b8;
  font-size:16px;
  font-weight:800;
}

.dayText{
  margin-top:8px;
  color:#9aa8c8;
  font-size:13px;
}

.summary{
  background:linear-gradient(135deg,#142b4a,#0c739e);
  border-radius:20px;
  padding:17px;
  margin-bottom:15px;
}

.summaryTitle{
  font-size:12px;
  opacity:.75;
}

.summaryValue{
  font-size:30px;
  font-weight:900;
  margin-top:5px;
}

.summaryGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.summaryItem{
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:12px;
}

.small{
  font-size:11px;
  opacity:.7;
}

.value{
  font-size:17px;
  font-weight:900;
  margin-top:4px;
}

.package{
  background:#111c30;
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
}

.packageTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.packagePrice{
  font-size:19px;
  font-weight:900;
}

.countBox{
  background:#172238;
  border-radius:11px;
  min-width:65px;
  text-align:center;
  padding:10px;
}

.countNumber{
  font-size:21px;
  font-weight:900;
}

.countLabel{
  font-size:9px;
  color:#8e9ab3;
  margin-top:2px;
}

.packageInfo{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.infoBox{
  background:#0c1526;
  border-radius:11px;
  padding:10px;
}

.infoLabel{
  color:#8391ab;
  font-size:11px;
}

.infoValue{
  font-size:15px;
  font-weight:800;
  margin-top:4px;
}

.earned{
  color:#62e9b8;
}

.hidden{
  display:none;
}

.notFound{
  background:#311c27;
  color:#ff9baa;
  border-radius:14px;
  padding:14px;
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

<img
  src="./IMG_7968.png"
  class="logo"
  alt="Home Telecom"
>

<div class="header">

  <h1>Իմ Վաճառքները</h1>

  <div class="subtitle">
    Գրեք ձեր անունը և տեսեք ձեր այսօրվա արդյունքը
  </div>

</div>

<div class="searchBox">

  <input
    id="nameInput"
    class="nameInput"
    placeholder="Գրեք ձեր անունը"
    autocomplete="off"
  >

  <button
    class="searchButton"
    onclick="findEmployee()"
  >
    Տեսնել իմ արդյունքը
  </button>

</div>

<div id="status" class="status"></div>

<div id="result" class="hidden">

  <div class="welcome">

    <div
      class="employeeName"
      id="employeeName">
    </div>

    <div class="motivation">
      Դու կարող ես ավելին... 🚀
    </div>

    <div
      class="dayText"
      id="dayText">
    </div>

  </div>

  <div class="summary">

    <div class="summaryTitle">
      Այսօրվա ստացած բոնուս
    </div>

    <div
      class="summaryValue"
      id="totalBonus">
      0 դրամ
    </div>

    <div class="summaryGrid">

      <div class="summaryItem">

        <div class="small">
          Այսօրվա վաճառք
        </div>

        <div
          class="value"
          id="totalSales">
          0
        </div>

      </div>

      <div class="summaryItem">

        <div class="small">
          Վերջին թարմացում
        </div>

        <div
          class="value"
          id="updatedTime">
          —
        </div>

      </div>

    </div>

  </div>

  <div id="packages"></div>

</div>

<div
  id="notFound"
  class="notFound hidden"
>
  Այս անունով աշխատակից չի գտնվել
</div>

</div>

<script>

const SUPABASE_URL=
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY=
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const fields=[
  "package_3900",
  "package_4900",
  "package_5900",
  "package_6900",
  "package_7900",
  "package_8900"
];

let currentName="";
let currentDay="";
let refreshTimer=null;

function money(n){

  return new Intl.NumberFormat("hy-AM")
    .format(Number(n)||0)+" դրամ";
}

function localDateKey(){

  const d=new Date();

  return[
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function prettyDate(dateString){

  const months=[
    "Հունվար","Փետրվար","Մարտ","Ապրիլ",
    "Մայիս","Հունիս","Հուլիս","Օգոստոս",
    "Սեպտեմբեր","Հոկտեմբեր","Նոյեմբեր","Դեկտեմբեր"
  ];

  const parts=dateString.split("-");

  return `${Number(parts[2])} ${months[Number(parts[1])-1]} ${parts[0]}`;
}

function setStatus(text){
  document.getElementById("status").textContent=text;
}

async function findEmployee(){

  const input=document
    .getElementById("nameInput")
    .value.trim();

  if(!input){

    setStatus("Գրեք ձեր անունը");
    return;
  }

  currentName=input;
  currentDay=localDateKey();

  localStorage.setItem(
    "employeeName",
    input
  );

  await loadEmployee(true);

  startAutoRefresh();
}

async function loadEmployee(showLoading=false){

  if(!currentName) return;

  const today=localDateKey();

  if(today!==currentDay){
    currentDay=today;
  }

  if(showLoading){
    setStatus("Բեռնում է...");
  }

  try{

    const employeeRes=await db
      .from("employees")
      .select("*")
      .ilike("name",currentName)
      .eq("active",true)
      .maybeSingle();

    if(employeeRes.error){
      throw employeeRes.error;
    }

    const employee=employeeRes.data;

    if(!employee){

      document
        .getElementById("result")
        .classList.add("hidden");

      document
        .getElementById("notFound")
        .classList.remove("hidden");

      setStatus("");

      return;
    }

    const [
      packagesRes,
      salesRes
    ]=await Promise.all([

      db
        .from("packages")
        .select("price,bonus")
        .order("price"),

      db
        .from("daily_sales")
        .select("*")
        .eq("employee_id",employee.id)
        .eq("sale_date",currentDay)
        .maybeSingle()

    ]);

    if(packagesRes.error){
      throw packagesRes.error;
    }

    if(salesRes.error){
      throw salesRes.error;
    }

    document
      .getElementById("notFound")
      .classList.add("hidden");

    renderEmployee(
      employee,
      packagesRes.data||[],
      salesRes.data
    );

    setStatus("● Այսօրվա տվյալները թարմացված են");

  }catch(error){

    console.error(error);

    setStatus("Չհաջողվեց բեռնել տվյալները");
  }
}

function renderEmployee(
  employee,
  packages,
  salesRow
){

  document
    .getElementById("result")
    .classList.remove("hidden");

  document.getElementById(
    "employeeName"
  ).textContent=employee.name;

  document.getElementById(
    "dayText"
  ).textContent=
    "Այսօրվա արդյունք — "+prettyDate(currentDay);

  let totalSales=0;
  let totalBonus=0;
  let html="";

  packages.forEach((p,i)=>{

    const count=
      salesRow
        ? Number(salesRow[fields[i]])||0
        : 0;

    const bonus=Number(p.bonus)||0;

    const earned=count*bonus;

    totalSales+=count;
    totalBonus+=earned;

    html+=`

      <div class="package">

        <div class="packageTop">

          <div class="packagePrice">
            ${money(p.price)}
          </div>

          <div class="countBox">

            <div class="countNumber">
              ${count}
            </div>

            <div class="countLabel">
              ՎԱՃԱՌՔ
            </div>

          </div>

        </div>

        <div class="packageInfo">

          <div class="infoBox">

            <div class="infoLabel">
              1 վաճառքից բոնուս
            </div>

            <div class="infoValue">
              ${money(bonus)}
            </div>

          </div>

          <div class="infoBox">

            <div class="infoLabel">
              Ստացած բոնուս
            </div>

            <div class="infoValue earned">
              ${money(earned)}
            </div>

          </div>

        </div>

      </div>
    `;
  });

  document
    .getElementById("packages")
    .innerHTML=html;

  document
    .getElementById("totalSales")
    .textContent=totalSales;

  document
    .getElementById("totalBonus")
    .textContent=money(totalBonus);

  document
    .getElementById("updatedTime")
    .textContent=
      new Date().toLocaleTimeString(
        "hy-AM",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );
}

function startAutoRefresh(){

  if(refreshTimer){
    clearInterval(refreshTimer);
  }

  refreshTimer=setInterval(()=>{

    if(currentName){
      loadEmployee(false);
    }

  },5000);
}

document
  .getElementById("nameInput")
  .addEventListener(
    "keydown",
    event=>{

      if(event.key==="Enter"){
        findEmployee();
      }

    }
  );

window.addEventListener(
  "load",
  async()=>{

    currentDay=localDateKey();

    const saved=
      localStorage.getItem(
        "employeeName"
      );

    if(saved){

      currentName=saved;

      document
        .getElementById("nameInput")
        .value=saved;

      await loadEmployee(true);

      startAutoRefresh();
    }

  }
);

</script>

</body>
</html>

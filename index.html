<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Home Telecom Sales</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#08101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HT Sales">
<link rel="apple-touch-icon" href="./IMG_7968.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.logo{
  display:block;
  width:190px;
  max-width:65%;
  margin:8px auto 10px;
}

.title{
  text-align:center;
  font-size:28px;
  font-weight:900;
}

.sub{
  text-align:center;
  color:#8794aa;
  margin-top:5px;
}

.loginBox{
  background:#111c30;
  border-radius:22px;
  padding:18px;
  margin-top:20px;
}

.loginTitle{
  font-size:22px;
  font-weight:900;
}

.loginInfo{
  color:#8c99ad;
  line-height:1.5;
  font-size:13px;
  margin-top:7px;
}

.input{
  width:100%;
  margin-top:12px;
  padding:14px;
  background:#0b1526;
  color:white;
  border:1px solid #31405a;
  border-radius:12px;
  font-size:17px;
  outline:none;
}

.input:focus{
  border-color:#38c98d;
}

.loginBtn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  background:#1fa471;
  color:white;
  font-size:16px;
  font-weight:900;
}

.secondaryBtn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:12px;
  margin-top:8px;
  background:#1b2941;
  color:white;
  font-weight:800;
}

.dateBox{
  background:#111c30;
  border-radius:18px;
  padding:14px;
  text-align:center;
  margin-top:15px;
}

.date{
  color:#69e7b8;
  font-weight:900;
  font-size:18px;
}

.clock{
  color:#8794aa;
  margin-top:5px;
}

.employeeCard{
  background:#111c30;
  border-radius:22px;
  padding:18px;
  margin-top:12px;
}

.employeeName{
  font-size:29px;
  font-weight:900;
}

.totalBonus{
  margin-top:13px;
  background:linear-gradient(135deg,#104232,#12654b);
  border-radius:18px;
  padding:16px;
}

.totalLabel{
  opacity:.8;
  font-size:13px;
}

.totalValue{
  font-size:32px;
  font-weight:900;
  margin-top:5px;
}

.salesCount{
  color:#7dffbb;
  font-weight:900;
  margin-top:6px;
}

.motivation{
  margin-top:12px;
  background:#17253c;
  border-radius:15px;
  padding:13px;
  font-weight:900;
}

.packages{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:14px;
}

.package{
  background:#0b1526;
  border-radius:15px;
  padding:13px;
}

.packageName{
  font-size:16px;
  font-weight:900;
}

.price{
  color:#8492a8;
  font-size:12px;
  margin-top:3px;
}

.oneSale{
  color:#66caff;
  font-size:12px;
  margin-top:8px;
}

.count{
  font-size:22px;
  font-weight:900;
  margin-top:8px;
}

.earned{
  color:#6ceeb0;
  font-weight:900;
  font-size:12px;
  margin-top:4px;
}

.logout{
  margin-top:15px;
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#24334b;
  color:white;
  font-weight:900;
}

.status{
  text-align:center;
  color:#8794aa;
  font-size:12px;
  margin-top:12px;
}

.error{
  color:#ff7e89;
  margin-top:10px;
  font-size:13px;
  font-weight:700;
}

@media(max-width:450px){
  .packages{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<img src="./IMG_7968.png" class="logo">

<div class="title">Իմ Վաճառքները</div>
<div class="sub">Home Telecom</div>

<div id="loginArea">
  <div class="loginBox">

    <div class="loginTitle">Մուտք</div>

    <div class="loginInfo" id="loginInfo">
      Գրիր քո անունը
    </div>

    <input
      class="input"
      id="nameInput"
      placeholder="Անուն"
      autocomplete="off"
    >

    <div id="codeArea"></div>

    <div class="error" id="errorText"></div>

    <button
      class="loginBtn"
      id="mainButton"
      onclick="mainAction()"
    >
      Շարունակել
    </button>

    <button
      class="secondaryBtn"
      id="changeNameButton"
      onclick="resetLogin()"
      style="display:none"
    >
      Փոխել անունը
    </button>

  </div>
</div>

<div id="resultArea" style="display:none">

  <div class="dateBox">
    <div class="date" id="dateText"></div>
    <div class="clock" id="clockText"></div>
  </div>

  <div id="employeeResult"></div>

  <button class="logout" onclick="logout()">
    Դուրս գալ
  </button>

</div>

<div class="status" id="status"></div>

</div>

<script>
const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const fieldByCode = {
  home_standard:"package_6900",
  home_premium:"package_7900",
  home_ultima:"package_8900",
  inet1:"package_3900",
  inet2:"package_4900",
  inet3:"package_5900",
  iptv1:"package_iptv1",
  iptv2:"package_iptv2",
  iptv3:"package_iptv3"
};

const packageOrder = [
  "home_standard",
  "home_premium",
  "home_ultima",
  "inet1",
  "inet2",
  "inet3",
  "iptv1",
  "iptv2",
  "iptv3"
];

let employee = null;
let packages = [];
let currentDate = "";
let loginMode = "name";

function money(v){
  return new Intl.NumberFormat("hy-AM")
    .format(Math.round(Number(v)||0)) + " դրամ";
}

function todayKey(){
  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Yerevan",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(new Date());

  const map = {};

  parts.forEach(p=>{
    map[p.type]=p.value;
  });

  return `${map.year}-${map.month}-${map.day}`;
}

function updateClock(){
  const dateEl=document.getElementById("dateText");
  const clockEl=document.getElementById("clockText");

  if(!dateEl || !clockEl) return;

  const now=new Date();

  dateEl.textContent=
    now.toLocaleDateString(
      "hy-AM",
      {
        timeZone:"Asia/Yerevan",
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  clockEl.textContent=
    now.toLocaleTimeString(
      "hy-AM",
      {
        timeZone:"Asia/Yerevan",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );
}

function showError(text){
  document.getElementById("errorText").textContent=text;
}

function clearError(){
  document.getElementById("errorText").textContent="";
}

async function mainAction(){
  clearError();

  if(loginMode==="name"){
    await findEmployee();
    return;
  }

  if(loginMode==="create"){
    await createFirstCode();
    return;
  }

  if(loginMode==="login"){
    await loginWithCode();
  }
}

async function findEmployee(){

  const name =
    document.getElementById("nameInput")
    .value
    .trim();

  if(!name){
    showError("Գրիր քո անունը");
    return;
  }

  status.textContent="Ստուգվում է...";

  const result =
    await db
    .from("employees")
    .select("id,name,active,access_code")
    .eq("active",true)
    .ilike("name",name)
    .maybeSingle();

  status.textContent="";

  if(result.error){
    console.error(result.error);
    showError("Չհաջողվեց ստուգել անունը");
    return;
  }

  if(!result.data){
    showError("Այդ անունով աշխատակից չկա");
    return;
  }

  employee=result.data;

  document.getElementById("nameInput").disabled=true;
  document.getElementById("changeNameButton").style.display="block";

  if(!employee.access_code){

    loginMode="create";

    document.getElementById("loginInfo").textContent =
      "Առաջին մուտքն է։ Ստեղծիր քո կոդը։ Հաջորդ բոլոր մուտքերին նույն կոդն է պետք։";

    document.getElementById("codeArea").innerHTML=`
      <input
        class="input"
        id="codeInput"
        type="password"
        inputmode="numeric"
        placeholder="Ստեղծիր կոդ"
        autocomplete="new-password"
      >

      <input
        class="input"
        id="codeRepeatInput"
        type="password"
        inputmode="numeric"
        placeholder="Կրկնիր կոդը"
        autocomplete="new-password"
      >
    `;

    document.getElementById("mainButton").textContent =
      "Ստեղծել կոդ և մուտք գործել";

  }else{

    loginMode="login";

    document.getElementById("loginInfo").textContent =
      "Մուտքագրիր քո կոդը";

    document.getElementById("codeArea").innerHTML=`
      <input
        class="input"
        id="codeInput"
        type="password"
        inputmode="numeric"
        placeholder="Մուտքի կոդ"
        autocomplete="current-password"
      >
    `;

    document.getElementById("mainButton").textContent =
      "Մուտք գործել";
  }
}

async function createFirstCode(){

  clearError();

  const code =
    document.getElementById("codeInput")
    .value
    .trim();

  const repeat =
    document.getElementById("codeRepeatInput")
    .value
    .trim();

  if(!/^\d{4,8}$/.test(code)){
    showError("Կոդը պետք է լինի 4-ից 8 թվանշան");
    return;
  }

  if(code!==repeat){
    showError("Երկու կոդերը չեն համընկնում");
    return;
  }

  status.textContent="Կոդը պահպանվում է...";

  const check =
    await db
    .from("employees")
    .select("id,name,active,access_code")
    .eq("id",employee.id)
    .eq("active",true)
    .single();

  if(check.error){
    status.textContent="";
    showError("Չհաջողվեց ստուգել աշխատակցին");
    return;
  }

  if(check.data.access_code){
    status.textContent="";
    employee=check.data;
    loginMode="login";

    document.getElementById("loginInfo").textContent =
      "Կոդն արդեն ստեղծված է։ Մուտքագրիր քո կոդը։";

    document.getElementById("codeArea").innerHTML=`
      <input
        class="input"
        id="codeInput"
        type="password"
        inputmode="numeric"
        placeholder="Մուտքի կոդ"
      >
    `;

    document.getElementById("mainButton").textContent =
      "Մուտք գործել";

    return;
  }

  const result =
    await db
    .from("employees")
    .update({access_code:code})
    .eq("id",employee.id)
    .is("access_code",null)
    .select("id,name,active,access_code")
    .maybeSingle();

  status.textContent="";

  if(result.error){
    console.error(result.error);
    showError("Կոդը պահպանել չհաջողվեց");
    return;
  }

  if(!result.data){
    showError("Կոդն արդեն ստեղծվել է");
    resetLogin();
    return;
  }

  employee=result.data;

  localStorage.setItem(
    "ht_employee_name",
    employee.name
  );

  await openAccount();
}

async function loginWithCode(){

  clearError();

  const code =
    document.getElementById("codeInput")
    .value
    .trim();

  if(!code){
    showError("Գրիր կոդը");
    return;
  }

  status.textContent="Մուտք...";

  const result =
    await db
    .from("employees")
    .select("id,name,active")
    .eq("id",employee.id)
    .eq("access_code",code)
    .eq("active",true)
    .maybeSingle();

  status.textContent="";

  if(result.error){
    console.error(result.error);
    showError("Չհաջողվեց մուտք գործել");
    return;
  }

  if(!result.data){
    showError("❌ Կոդը սխալ է");
    return;
  }

  employee=result.data;

  localStorage.setItem(
    "ht_employee_name",
    employee.name
  );

  await openAccount();
}

async function openAccount(){

  document.getElementById("loginArea").style.display="none";
  document.getElementById("resultArea").style.display="block";

  currentDate=todayKey();

  updateClock();

  await loadResult();
}

async function loadResult(){

  if(!employee) return;

  currentDate=todayKey();

  const [pkgResult,salesResult] =
    await Promise.all([

      db
      .from("packages")
      .select("*"),

      db
      .from("daily_sales")
      .select("*")
      .eq("employee_id",employee.id)
      .eq("sale_date",currentDate)
      .maybeSingle()

    ]);

  if(pkgResult.error){
    console.error(pkgResult.error);
    status.textContent="Փաթեթները բեռնել չհաջողվեց";
    return;
  }

  if(salesResult.error){
    console.error(salesResult.error);
    status.textContent="Վաճառքները բեռնել չհաջողվեց";
    return;
  }

  packages=(pkgResult.data||[])
    .sort((a,b)=>
      packageOrder.indexOf(a.code) -
      packageOrder.indexOf(b.code)
    );

  renderResult(salesResult.data);

  status.textContent="● Թարմացված է";
}

function renderResult(row){

  let totalSales=0;
  let totalBonus=0;
  let html="";

  packages.forEach(pkg=>{

    const field=fieldByCode[pkg.code];

    if(!field) return;

    const count =
      Number(row ? row[field] : 0)||0;

    const employeeBonus =
      Number(pkg.employee_bonus)||0;

    const earned =
      count * employeeBonus;

    totalSales += count;
    totalBonus += earned;

    html+=`
      <div class="package">

        <div class="packageName">
          ${escapeHTML(pkg.name||pkg.code)}
        </div>

        <div class="price">
          ${money(pkg.price)}
        </div>

        <div class="oneSale">
          1 վաճառքից՝ ${money(employeeBonus)}
        </div>

        <div class="count">
          ${count} վաճառք
        </div>

        <div class="earned">
          +${money(earned)}
        </div>

      </div>
    `;
  });

  let motivation="";

  if(totalBonus<20000){
    motivation="Սա քիչ է, ավելին կարող ես դու... 🚀";
  }
  else if(totalBonus<40000){
    motivation="Այ էսպես շարունակիր 🔥";
  }
  else{
    motivation="Դու գերազանցեցիր քեզ 🏆";
  }

  document.getElementById("employeeResult").innerHTML=`

    <div class="employeeCard">

      <div class="employeeName">
        ${escapeHTML(employee.name)}
      </div>

      <div class="totalBonus">

        <div class="totalLabel">
          Այսօրվա քո բոնուսը
        </div>

        <div class="totalValue">
          ${money(totalBonus)}
        </div>

        <div class="salesCount">
          ${totalSales} վաճառք
        </div>

      </div>

      <div class="motivation">
        ${motivation}
      </div>

      <div class="packages">
        ${html}
      </div>

    </div>
  `;
}

function resetLogin(){

  employee=null;
  loginMode="name";

  document.getElementById("nameInput").disabled=false;
  document.getElementById("codeArea").innerHTML="";

  document.getElementById("loginInfo").textContent =
    "Գրիր քո անունը";

  document.getElementById("mainButton").textContent =
    "Շարունակել";

  document.getElementById("changeNameButton").style.display =
    "none";

  clearError();
}

function logout(){

  employee=null;
  loginMode="name";

  document.getElementById("resultArea").style.display="none";
  document.getElementById("loginArea").style.display="block";

  document.getElementById("nameInput").disabled=false;
  document.getElementById("nameInput").value="";

  document.getElementById("codeArea").innerHTML="";

  document.getElementById("loginInfo").textContent =
    "Գրիր քո անունը";

  document.getElementById("mainButton").textContent =
    "Շարունակել";

  document.getElementById("changeNameButton").style.display =
    "none";

  status.textContent="";
  clearError();
}

function escapeHTML(t){
  return String(t)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

const savedName =
  localStorage.getItem("ht_employee_name");

if(savedName){
  document.getElementById("nameInput").value=savedName;
}

setInterval(updateClock,1000);

setInterval(()=>{

  if(!employee) return;

  const newDate=todayKey();

  if(newDate!==currentDate){
    loadResult();
    return;
  }

  loadResult();

},5000);

</script>

</body>
</html>
